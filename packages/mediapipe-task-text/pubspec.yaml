name: mediapipe_text
description: "Google's MediaPipe text tasks for Flutter: text classification and embeddings, language detection, EmbeddingGemma, proofreading and summarization."
version: 0.2.0
repository: https://github.com/hugocornellier/mediapipe_flutter/tree/main/packages/mediapipe-task-text
issue_tracker: https://github.com/hugocornellier/mediapipe_flutter/issues
topics:
  - mediapipe
  - machine-learning
  - nlp
  - text-classification
  - embeddings
# Not published yet; `tool/publish_check.py` in mediapipe-core runs the
# publish dry run on a copy without this line.
publish_to: none

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  async: ^2.13.0
  code_assets: ^1.2.1
  ffi: ^2.1.4
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.3
  mediapipe_core:
    path: ../mediapipe-core
  meta: ^1.18.0
  web: ^1.1.1

dev_dependencies:
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  path: ^1.9.1
  test: ^1.31.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.mediapipe.flutter.text
        pluginClass: MediaPipeTextPlugin
        dartPluginClass: MediaPipeTextAndroid
        dartFileName: mediapipe_text_android.dart
      web:
        pluginClass: MediaPipeTextWeb
        fileName: mediapipe_text_web.dart
  assets:
    - path: assets/worker.js
      platforms: [web]
    - path: assets/runtime.json
      platforms: [web]

# Used when this package is the root (Dart tests/tools). Consumers opt in in
# their own pubspec, keeping the shared runtime optional for vision-only apps.
hooks:
  user_defines:
    mediapipe_core:
      tasks_runtime: true
