name: mediapipe_flutter_text
publish_to: none
description: An implementation of MediaPipe text-based Tasks.
version: 0.0.1

repository: https://github.com/hugocornellier/mediapipe_flutter/tree/main/packages/mediapipe-task-text
issue_tracker: https://github.com/hugocornellier/mediapipe_flutter/issues/

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  async: ^2.13.0
  code_assets: ^1.2.1
  ffi: ^2.1.4
  hooks: '>=2.0.2 <2.1.0'
  logging: ^1.3.0
  # Validated range. 0.19.3+ needs meta 1.18, which Flutter 3.47 provides;
  # moving up is a separate, tested upgrade.
  native_toolchain_c: '>=0.19.2 <0.19.3'
  mediapipe_flutter_core:
    path: ../mediapipe-core
  web: ^1.1.1

dev_dependencies:
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  path: ^1.9.1
  test: ^1.31.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.mediapipe.flutter.text
        pluginClass: MediaPipeTextPlugin
        dartPluginClass: MediaPipeTextAndroid
        dartFileName: mediapipe_flutter_text_android.dart
      web:
        pluginClass: MediaPipeTextWeb
        fileName: mediapipe_flutter_text_web.dart
  assets:
    - path: assets/bridge.js
      platforms: [web]
    - path: assets/worker.js
      platforms: [web]
    - path: assets/runtime.json
      platforms: [web]

# Used when this package is the root (Dart tests/tools). Consumers opt in in
# their own pubspec, keeping the shared runtime optional for vision-only apps.
hooks:
  user_defines:
    mediapipe_flutter_core:
      tasks_runtime: true
