name: mediapipe_flutter_text
publish_to: none
description: An implementation of MediaPipe text-based Tasks.
version: 0.0.1

repository: https://github.com/hugocornellier/mediapipe_flutter/tree/main/packages/mediapipe-task-text
issue_tracker: https://github.com/hugocornellier/mediapipe_flutter/issues/

platforms:
  macos:

environment:
  sdk: ^3.12.0

dependencies:
  async: ^2.13.0
  ffi: ^2.1.4
  hooks: '>=2.0.2 <2.1.0'
  logging: ^1.3.0
  # 0.19.3+ requires meta newer than Flutter 3.44's SDK pin.
  native_toolchain_c: '>=0.19.2 <0.19.3'
  mediapipe_flutter_core:
    path: ../mediapipe-core

dev_dependencies:
  crypto: ^3.0.6
  lints: ^6.1.0
  path: ^1.9.1
  test: ^1.31.0

# Used when this package is the root (Dart tests/tools). Consumers opt in in
# their own pubspec, keeping the shared runtime optional for vision-only apps.
hooks:
  user_defines:
    mediapipe_flutter_core:
      tasks_runtime: true
