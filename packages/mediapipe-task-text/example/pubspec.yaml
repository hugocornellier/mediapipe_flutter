name: example
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0
  mediapipe_flutter_core:
    path: ../../mediapipe-core
  mediapipe_flutter_text:
    path: ../
  path: ^1.8.3
  path_provider: ^2.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/bert_classifier.tflite
    - assets/language_detector.tflite
    - assets/universal_sentence_encoder.tflite

hooks:
  user_defines:
    mediapipe_flutter_core:
      tasks_runtime: true
