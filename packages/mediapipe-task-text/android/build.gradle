group = 'dev.mediapipe.flutter.text'
version = '1.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.11.1' }
}
apply plugin: 'com.android.library'

android {
    namespace = 'dev.mediapipe.flutter.text'
    compileSdk = 36
    defaultConfig {
        minSdk = 24
        // The release build's R8 rules come from mediapipe_core, which every
        // app using this plugin also depends on.
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
repositories { google(); mavenCentral() }
dependencies {
    // Core's Android library: the worker thread, model buffers, channel
    // dispatch and streamed updates every family plugin builds on (TaskHost).
    implementation project(':mediapipe_core')
    // As in mediapipe_vision: Google's 1.0.0 POMs declare
    // protobuf-javalite while the vision SDK needs full protobuf-java at
    // runtime (google-ai-edge/mediapipe#6348). One app can hold all three
    // plugins only if they agree, so this one uses the full runtime too.
    implementation('com.google.mediapipe:tasks-text:1.0.0') {
        exclude group: 'com.google.protobuf', module: 'protobuf-javalite'
    }
    implementation 'com.google.protobuf:protobuf-java:4.26.1'
}
