name: mediapipe_flutter_audio_android
description: Google's official MediaPipe Android audio SDK for mediapipe_flutter_audio.
version: 0.0.1
publish_to: none
environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  mediapipe_flutter_audio:
    path: ../mediapipe-task-audio
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.mediapipe.flutter.audio
        pluginClass: MediaPipeAudioPlugin
        dartPluginClass: MediaPipeAudioAndroid
