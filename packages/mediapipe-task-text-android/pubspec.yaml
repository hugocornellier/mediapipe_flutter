name: mediapipe_flutter_text_android
description: Google's official MediaPipe Android text SDK for mediapipe_flutter_text.
version: 0.0.1
publish_to: none
environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  mediapipe_flutter_text:
    path: ../mediapipe-task-text
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.mediapipe.flutter.text
        pluginClass: MediaPipeTextPlugin
        dartPluginClass: MediaPipeTextAndroid
