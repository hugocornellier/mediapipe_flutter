name: mediapipe_flutter_vision_android
description: Official Android FaceLandmarker SDK adapter for mediapipe_flutter_vision.
version: 0.0.1
publish_to: none
environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  mediapipe_flutter_vision:
    path: ../mediapipe-task-vision
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.mediapipe.flutter.vision
        pluginClass: MediaPipeVisionPlugin
        dartPluginClass: AndroidFaceLandmarker
