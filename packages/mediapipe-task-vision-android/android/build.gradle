group = 'dev.mediapipe.flutter.vision'
version = '1.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.11.1' }
}
apply plugin: 'com.android.library'

android {
    namespace = 'dev.mediapipe.flutter.vision'
    compileSdk = 36
    defaultConfig { minSdk = 24 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
repositories { google(); mavenCentral() }
dependencies {
    // Google's 1.0.0 POMs declare protobuf-javalite, but Holistic Landmarker's
    // options were compiled against full protobuf-java and fail at runtime
    // with NoSuchMethodError on Any$Builder.build(). Same version, full runtime:
    // https://github.com/google-ai-edge/mediapipe/issues/6348
    implementation('com.google.mediapipe:tasks-vision:1.0.0') {
        exclude group: 'com.google.protobuf', module: 'protobuf-javalite'
    }
    implementation 'com.google.protobuf:protobuf-java:4.26.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
