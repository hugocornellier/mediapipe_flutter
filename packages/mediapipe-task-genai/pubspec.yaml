name: mediapipe_flutter_genai
publish_to: none
description: An implementation of MediaPipe generative AI-based Tasks.
version: 0.0.1

repository: https://github.com/hugocornellier/mediapipe_flutter/tree/main/packages/mediapipe-task-genai
issue_tracker: https://github.com/hugocornellier/mediapipe_flutter/issues

platforms:
  android:
  ios:
  # linux:
  macos:
  # web:
  # windows:

environment:
  sdk: ^3.12.0

dependencies:
  async: ^2.13.0
  equatable: ^2.0.5
  ffi: ^2.1.4
  http: ^1.6.0
  logging: ^1.3.0
  mediapipe_flutter_core:
    path: ../mediapipe-core
  code_assets: ^1.2.1
  # hooks 2.1+ requires meta newer than Flutter 3.44's SDK pin.
  hooks: '>=2.0.2 <2.1.0'
  path: ^1.8.3

dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.1.0
  test: ^1.31.0
