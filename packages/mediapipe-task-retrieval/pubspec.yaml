name: mediapipe_retrieval
description: "Google's MediaPipe retrieval tasks for Flutter: Universal Embedder, one embedding space for text, images and audio, and Semantic Retriever, an on-device vector index over them."
version: 0.1.0
repository: https://github.com/hugocornellier/mediapipe_flutter/tree/main/packages/mediapipe-task-retrieval
issue_tracker: https://github.com/hugocornellier/mediapipe_flutter/issues
topics:
  - mediapipe
  - machine-learning
  - embeddings
  - retrieval
# Not published yet; `tool/publish_check.py` in mediapipe-core runs the
# publish dry run on a copy without this line.
publish_to: none

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  code_assets: ^1.2.1
  ffi: ^2.1.4
  hooks: ^2.2.0
  mediapipe_core:
    path: ../mediapipe-core
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: ^1.31.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: MediaPipeRetrievalWeb
        fileName: mediapipe_retrieval_web.dart
  assets:
    - path: assets/worker.js
      platforms: [web]
    - path: assets/runtime.json
      platforms: [web]
