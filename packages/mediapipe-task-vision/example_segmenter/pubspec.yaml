name: mediapipe_segmenter
description: Interactive MagicTouch object selection on macOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  mediapipe_flutter_vision:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/interactive_segmentation.task
    - assets/animals.jpg
    - assets/portrait.jpg

hooks:
  user_defines:
    mediapipe_flutter_core:
      tasks_runtime: true
    mediapipe_flutter_vision:
      tasks: [interactive_segmenter]
