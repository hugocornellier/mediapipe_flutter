name: mediapipe_flutter_vision
description: Official MediaPipe face tasks for macOS arm64 and CPU inference on arm64 iOS simulators.
version: 0.0.1
repository: https://github.com/hugocornellier/mediapipe_flutter
issue_tracker: https://github.com/hugocornellier/mediapipe_flutter/issues
publish_to: none

environment:
  sdk: ^3.12.0

platforms:
  macos:
  ios:
  android:
  windows:
  linux:
  web:

dependencies:
  archive: ^4.2.0
  code_assets: ^1.2.1
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: '>=2.0.2 <2.1.0'
  mediapipe_flutter_core:
    path: ../mediapipe-core

dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.1.0
  test: ^1.31.0

# Package-maintainer tests exercise coexistence of all three runtimes.
# Consumer apps choose their own tasks; the hook's default remains face-only.
hooks:
  user_defines:
    mediapipe_flutter_core:
      tasks_runtime: true
    mediapipe_flutter_vision:
      tasks:
        [face_detector, face_landmarker, interactive_segmenter, object_detector]
