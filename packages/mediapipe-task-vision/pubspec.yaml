name: mediapipe_flutter_vision
description: Official MediaPipe Face Detector for Dart and Flutter on macOS arm64.
version: 0.0.1
repository: https://github.com/hugocornellier/mediapipe_flutter
issue_tracker: https://github.com/hugocornellier/mediapipe_flutter/issues
publish_to: none

environment:
  sdk: ^3.12.0

platforms:
  macos:

dependencies:
  code_assets: ^1.2.1
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: '>=2.0.2 <2.1.0'
  mediapipe_flutter_core:
    path: ../mediapipe-core

dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.1.0
  test: ^1.31.0
