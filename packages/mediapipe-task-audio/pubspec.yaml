name: mediapipe_flutter_audio
publish_to: none
description: MediaPipe's official Audio Classifier for Dart and Flutter.
version: 0.0.1

repository: https://github.com/hugocornellier/mediapipe_flutter/tree/main/packages/mediapipe-task-audio
issue_tracker: https://github.com/hugocornellier/mediapipe_flutter/issues/

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  code_assets: ^1.2.1
  ffi: ^2.1.4
  hooks: ^2.2.0
  mediapipe_flutter_core:
    path: ../mediapipe-core
  web: ^1.1.1

dev_dependencies:
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: ^1.31.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.mediapipe.flutter.audio
        pluginClass: MediaPipeAudioPlugin
        dartPluginClass: MediaPipeAudioAndroid
        dartFileName: mediapipe_flutter_audio_android.dart
      web:
        pluginClass: MediaPipeAudioWeb
        fileName: mediapipe_flutter_audio_web.dart
  assets:
    - path: assets/bridge.js
      platforms: [web]
    - path: assets/worker.js
      platforms: [web]
    - path: assets/runtime.json
      platforms: [web]

# Used when this package is the root (Dart tests/tools). Consumers opt in in
# their own pubspec, as for the text package.
hooks:
  user_defines:
    mediapipe_flutter_core:
      tasks_runtime: true
