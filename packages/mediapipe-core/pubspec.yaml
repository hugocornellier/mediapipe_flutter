name: mediapipe_flutter_core
publish_to: none
description: Shared logic and utilities required by other MediaPipe Task packages.
version: 0.0.1+1

repository: https://github.com/hugocornellier/mediapipe_flutter/tree/main/packages/mediapipe-core
issue_tracker: https://github.com/hugocornellier/mediapipe_flutter/issues

platforms:
  android:
  ios:
  linux:
  macos:
  # web:
  windows:

environment:
  sdk: ^3.12.0

dependencies:
  archive: ^4.2.0
  code_assets: ^1.2.1
  crypto: ^3.0.6
  equatable: ^2.0.5
  ffi: ^2.1.4
  # hooks 2.1+ requires meta newer than Flutter 3.44's SDK pin.
  hooks: '>=2.0.2 <2.1.0'
  http: ^1.6.0
  logging: ^1.3.0
  meta: ^1.18.0

dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.1.0
  test: ^1.31.0
