name: mediapipe_core
description: "Shared layer for the MediaPipe task packages: Google's engine on each platform, verified downloads, an on-demand model store and the browser runtime."
version: 0.1.0
repository: https://github.com/hugocornellier/mediapipe_flutter/tree/main/packages/mediapipe-core
issue_tracker: https://github.com/hugocornellier/mediapipe_flutter/issues
topics:
  - mediapipe
  - machine-learning
  - ffi
# Not published yet; `tool/publish_check.py` in mediapipe-core runs the
# publish dry run on a copy without this line.
publish_to: none

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.2.0
  code_assets: ^1.2.1
  crypto: ^3.0.6
  equatable: ^2.0.5
  ffi: ^2.1.4
  hooks: ^2.2.0
  http: ^1.6.0
  logging: ^1.3.0
  meta: ^1.18.0
  path_provider: ^2.1.5
  web: ^1.1.1
  yaml: ^3.1.3

dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.1.0
  test: ^1.31.0

flutter:
  assets:
    - assets/verified_runtime.js
