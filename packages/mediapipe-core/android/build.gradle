group = 'dev.mediapipe.flutter.core'
version = '1.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.11.1' }
}
apply plugin: 'com.android.library'

android {
    namespace = 'dev.mediapipe.flutter.core'
    compileSdk = 36
    defaultConfig {
        minSdk = 24
        // Applied to every app's release build; see the file.
        consumerProguardFiles 'proguard-rules.pro'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
repositories { google(); mavenCentral() }
dependencies {
    // The result containers every family's SDK shares; the families' AARs
    // bring the same release. Google's 1.0.0 POMs declare protobuf-javalite
    // while the vision SDK needs full protobuf-java at runtime
    // (google-ai-edge/mediapipe#6348), so every module agrees on the full one.
    implementation('com.google.mediapipe:tasks-core:1.0.0') {
        exclude group: 'com.google.protobuf', module: 'protobuf-javalite'
    }
    implementation 'com.google.protobuf:protobuf-java:4.26.1'
}
