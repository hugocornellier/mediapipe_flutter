name: mediapipe_flutter_text_web
description: Google's official MediaPipe browser text tasks for mediapipe_flutter_text.
version: 0.0.1
publish_to: none
environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  mediapipe_flutter_text:
    path: ../mediapipe-task-text
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      web:
        pluginClass: MediaPipeTextWeb
        fileName: mediapipe_flutter_text_web.dart
  assets:
    - assets/bridge.js
    - assets/worker.js
    - assets/runtime/
    - assets/runtime/wasm/
