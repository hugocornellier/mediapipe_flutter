name: Gallery test build

permissions:
  contents: read

# A one-off build of the release gallery for testers, on the tree of the
# upstream PR. It runs only on test-build/ branches.
on:
  push:
    branches: ['test-build/**']

jobs:
  linux:
    name: Gallery release / linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          linux-profile: gallery
          modern-model-cache: 'true'
      - name: Prepare the gallery with every task
        run: dart run tool/gallery_builder/bin/prepare_gallery.dart --target linux/x64
      - name: Build
        working-directory: gallery
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package
        run: |
          mkdir -p dist
          tar -C gallery/build/linux/x64/release -czf dist/mediapipe-gallery-linux-x64.tar.gz bundle
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gallery-test-linux-x64
          path: dist/mediapipe-gallery-linux-x64.tar.gz
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  windows:
    name: Gallery release / windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          modern-model-cache: 'true'
      - name: Prepare the gallery with every task
        run: dart run tool/gallery_builder/bin/prepare_gallery.dart --target windows/x64
      - name: Build
        working-directory: gallery
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # The Visual C++ runtime, app-local, for PCs without the redistributable.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" gallery/build/windows/x64/runner/Release/
          }
          Compress-Archive -Path gallery/build/windows/x64/runner/Release/* -DestinationPath dist/mediapipe-gallery-windows-x64.zip
          Get-ChildItem dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gallery-test-windows-x64
          path: dist/mediapipe-gallery-windows-x64.zip
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  android:
    name: Gallery release / android arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: ./.github/actions/setup
        with:
          modern-model-cache: 'true'
      # Gradle's own NDK and CMake downloads give up on one corrupt archive.
      - uses: ./.github/actions/android-ndk
      - name: Prepare the gallery with every task
        run: dart run tool/gallery_builder/bin/prepare_gallery.dart --target android/arm64
      - name: Build
        working-directory: gallery
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          mkdir -p ../dist && cp build/app/outputs/flutter-apk/app-release.apk ../dist/mediapipe-gallery-android-arm64.apk
          ls -la ../dist
      # Laya (678 MB) and both EmbeddingGemma 2 models (165 and 388 MB) are
      # bundled, as every other task's model is.
      - name: Every bundled model is in the APK
        run: |
          python3 - <<'PY'
          import json, zipfile
          with open('gallery/assets/mediapipe/manifest.json') as manifest:
              models = [entry['file'] for entry in json.load(manifest)['models']]
          with zipfile.ZipFile('dist/mediapipe-gallery-android-arm64.apk') as apk:
              sizes = {i.filename: i.file_size for i in apk.infolist()}
          missing = [m for m in models if f'assets/flutter_assets/assets/mediapipe/{m}' not in sizes]
          assert not missing, missing
          large = sorted(s for n, s in sizes.items() if n.startswith('assets/flutter_assets/assets/mediapipe/') and s > 150_000_000)
          assert len(large) >= 3, large
          print(len(models), 'models;', large)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gallery-test-android-arm64
          path: dist/mediapipe-gallery-android-arm64.apk
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  # The iOS line testers run, without signing, which needs their own team.
  ios:
    name: From source / ios arm64
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Prepare the gallery with every task
        run: dart run tool/gallery_builder/bin/prepare_gallery.dart --target ios/arm64
      - name: Build
        working-directory: gallery
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          du -sh build/ios/iphoneos/Runner.app
          [ "$(find build/ios/iphoneos/Runner.app -type f -size +150M | wc -l)" -ge 3 ]

  # The released APK on a physical phone (Pixel 8a), explored by Test Lab's
  # Robo crawler, which fails on a crash.
  android-phone:
    name: Released APK on a phone / Pixel 8a
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FIREBASE_PROJECT_ID: flutter-litert
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gallery-test-android-arm64
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
      - name: Robo on the released APK
        run: >-
          gcloud firebase test android run
          --project "$FIREBASE_PROJECT_ID" --type robo
          --app mediapipe-gallery-android-arm64.apk
          --device "model=akita,version=35,locale=en,orientation=portrait"
          --timeout 10m --results-history-name mediapipe-gallery-test-build

  # Every bundled model read from the app's assets on the same phone, as a
  # page reads its standard model: the largest is 678 MB.
  android-phone-assets:
    name: Bundled models on a phone / Pixel 8a
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FIREBASE_PROJECT_ID: flutter-litert
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: ./.github/actions/setup
        with:
          modern-model-cache: 'true'
      - uses: ./.github/actions/android-ndk
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
      - name: Prepare the gallery with every task
        run: |
          dart run tool/gallery_builder/bin/prepare_gallery.dart --target android/arm64
          cd gallery && flutter pub get
      - name: Build the app and instrumentation APKs
        working-directory: gallery
        run: |
          target="$PWD/integration_test/assets_test.dart"
          flutter build apk --config-only --debug --target "$target" --target-platform android-arm64
          cd android
          ./gradlew app:assembleAndroidTest -Pmediapipe.testLabAbi=arm64-v8a
          ./gradlew app:assembleDebug -Ptarget="$target" -Ptarget-platform=android-arm64 -Pmediapipe.testLabAbi=arm64-v8a
      - name: Run the assets suite
        run: >-
          gcloud firebase test android run
          --project "$FIREBASE_PROJECT_ID" --type instrumentation
          --app gallery/build/app/outputs/apk/debug/app-debug.apk
          --test gallery/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          --device "model=akita,version=35,locale=en,orientation=portrait"
          --timeout 30m --results-history-name mediapipe-gallery-test-build

  # The packaged builds on runners that did not build them, with only the
  # runtime libraries a desktop has.
  linux-launch:
    name: Packaged build launches / linux x64
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Runtime libraries only
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libgtk-3-0t64 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-good gstreamer1.0-libav libegl1 libgles2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gallery-test-linux-x64
      - name: Launch and keep running for 90 seconds
        run: |
          tar -xzf mediapipe-gallery-linux-x64.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/bundle"
          ! ldd mediapipe_gallery lib/*.so | grep 'not found'
          # Laya and both EmbeddingGemma 2 models are bundled: 678, 165 and 388 MB.
          find data -type f -size +150M -exec ls -la {} +
          [ "$(find data -type f -size +150M | wc -l)" -ge 3 ]
          status=0; timeout 90 xvfb-run -a ./mediapipe_gallery > launch.log 2>&1 || status=$?
          cat launch.log
          [ "$status" = 124 ]

  windows-launch:
    name: Packaged build launches / windows x64
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gallery-test-windows-x64
      - name: Launch and keep running for 90 seconds
        run: |
          Expand-Archive mediapipe-gallery-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP\gallery"
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path "$env:RUNNER_TEMP\gallery\$dll")) { throw "$dll is not bundled" }
          }
          # Laya and both EmbeddingGemma 2 models are bundled: 678, 165 and 388 MB.
          $large = Get-ChildItem -Recurse -File "$env:RUNNER_TEMP\gallery\data" | Where-Object Length -gt 150MB
          $large | Format-Table Name, Length
          if ($large.Count -lt 3) { throw "only $($large.Count) large models are bundled" }
          $app = Start-Process "$env:RUNNER_TEMP\gallery\mediapipe_gallery.exe" -PassThru
          Start-Sleep 90
          if ($app.HasExited) { throw "exited with $($app.ExitCode)" }
          Stop-Process $app.Id

  # The build-from-source line testers run, with every task and no model
  # cache, then the journey through every page in a release build.
  journey:
    name: From source, every page / ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, device: linux, target: linux/x64 }
          - { os: windows-2025, device: windows, target: windows/x64 }
          - { os: macos-15, device: macos, target: macos/arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          linux-profile: gallery
      - name: Prepare the gallery with every task
        shell: bash
        run: dart run tool/gallery_builder/bin/prepare_gallery.dart --target ${{ matrix.target }}
      - name: The journey through every page in a release build
        shell: bash
        run: |
          python=python3; if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          run "$python" -B tool/ci/run_release_suite.py --target ${{ matrix.device }} --suite integration_test/gallery_journey_test.dart --timeout 2400
