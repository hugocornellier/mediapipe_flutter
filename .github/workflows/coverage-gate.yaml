name: Task coverage gate

# Waits for this commit's Android, iOS, web, desktop and macOS runs, collects
# the `coverage-*` rows their jobs record (tool/coverage/record.py), and fails
# unless every cell tool/coverage/matrix.json marks required has a passing row.
# Device cells take rows from the physical-device workflows (this commit's
# run, else a nightly on main within 48 h); pull requests only report them.
# The job summary shows the task x platform table.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  gate:
    name: Every required task, platform and delegate passed
    runs-on: ubuntu-24.04
    # The longest recording workflow (iOS) can queue for a hosted macOS
    # runner before its hour of tests.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v7
      - name: Gate tests
        run: python3 -B -m unittest tool/coverage/test_gate.py
      - name: Collect rows and check the matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tool/coverage/gate.py --collect
          --sha ${{ github.event.pull_request.head.sha || github.sha }}
          --rows build/coverage-rows --timeout-minutes 190
          ${{ github.event_name == 'pull_request' && '--lenient-devices' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-coverage-rows
          path: build/coverage-rows/
          if-no-files-found: warn
