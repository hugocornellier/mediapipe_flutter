name: Mirror probe

permissions:
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/mirror-probe.yaml

jobs:
  probe:
    name: Probe ${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Time a large file from each Ubuntu mirror
        shell: bash
        run: |
          echo "ImageVersion=$ImageVersion"
          cat /etc/apt/sources.list.d/ubuntu.sources
          cat /etc/apt/apt-mirrors.txt 2>/dev/null || true
          mirrors='azure.archive.ubuntu.com/ubuntu archive.ubuntu.com/ubuntu us.archive.ubuntu.com/ubuntu mirrors.edge.kernel.org/ubuntu mirrors.kernel.org/ubuntu mirror.us.leaseweb.net/ubuntu ubuntu.osuosl.org/ubuntu mirror.math.princeton.edu/pub/ubuntu mirrors.xtom.com/ubuntu mirror.pit.teraswitch.com/ubuntu mirrors.mit.edu/ubuntu'
          # The noble pocket's universe index (about 15 MB) is on every mirror.
          for m in $mirrors; do
            curl -s -o /dev/null --max-time 40 -w "$m index: %{http_code} %{size_download} bytes in %{time_total}s (%{speed_download} B/s)\n" "http://$m/dists/noble/universe/binary-amd64/Packages.xz" || echo "$m index: curl exit $?"
          done
          # One large deb, from the noble pocket so every mirror has it.
          path=$(apt-cache madison libllvm18 2>/dev/null | head -3)
          echo "$path"
          for m in $mirrors; do
            curl -s -o /dev/null --max-time 40 -w "$m deb: %{http_code} %{size_download} bytes in %{time_total}s (%{speed_download} B/s)\n" "http://$m/pool/main/l/llvm-toolchain-18/libllvm18_1%3a18.1.3-1ubuntu1_amd64.deb" || echo "$m deb: curl exit $?"
          done
