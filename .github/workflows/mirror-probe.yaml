name: Mirror probe

permissions:
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/mirror-probe.yaml

jobs:
  speed:
    name: Speed ${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Time one large deb and the security index on each mirror
        shell: bash
        run: |
          mirrors='azure.archive.ubuntu.com/ubuntu archive.ubuntu.com/ubuntu security.ubuntu.com/ubuntu us.archive.ubuntu.com/ubuntu mirrors.edge.kernel.org/ubuntu'
          for m in $mirrors; do
            curl -s -o /dev/null --max-time 30 -w "$m clang deb: %{http_code} %{size_download} bytes in %{time_total}s (%{speed_download} B/s)\n" "http://$m/pool/main/l/llvm-toolchain-18/libllvm18_1%3a18.1.3-1_amd64.deb" || echo "$m clang deb: curl exit $?"
            curl -s -o /dev/null --max-time 30 -w "$m security InRelease: %{http_code} %{size_download} bytes in %{time_total}s\n" "http://$m/dists/noble-security/InRelease" || echo "$m security: curl exit $?"
          done

  drill:
    name: Fallback drill
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A key no run has saved, so the packages are downloaded.
      ImageVersion: drill-1
    steps:
      - uses: actions/checkout@v7
      - name: Make the runner's own mirror unreachable
        run: |
          printf 'http://10.255.255.1/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
      - uses: ./.github/actions/setup
        with:
          flutter: 'false'
          python: 'false'
          linux-profile: gallery
      - name: The packages are installed
        run: dpkg -s clang libgtk-3-dev xvfb | grep -E '^(Package|Status)'
