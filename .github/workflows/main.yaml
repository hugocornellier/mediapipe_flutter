name: macOS tasks

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push on the same branch supersedes the queued matrix; the hosted
# macOS pool is small enough that stale runs otherwise starve the latest one.
concurrency:
  group: macos-tasks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modern-task-matrix:
    name: Modern tasks / options and sustained CPU inference
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Prepare the official models
        run: |
          cd tool/task_benchmarks
          dart pub get
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          cd ../../packages/mediapipe-task-text
          dart pub get
          dart tool/download_embedding_gemma.dart
          dart tool/download_proofreader.dart
          dart tool/download_summarizer.dart
          cd ../mediapipe-task-vision
          dart pub get
          dart tool/download_interactive_segmenter.dart
      - name: Validate option combinations, caches, lifecycle and sustained use
        run: python3 -B tool/task_benchmarks/run_macos.py --output build/task-benchmarks/ci --iterations 25 --reloads 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-task-matrix
          path: build/task-benchmarks/ci/
          if-no-files-found: error

  embedding-consumer:
    name: Modern text tasks / fresh macOS consumer
    runs-on: macos-15
    timeout-minutes: 25
    env:
      MEDIAPIPE_CLASSIC_TEXT_REFERENCE_DIR: ${{ github.workspace }}/build/classic-text-reference
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate official CPU text references on this runner
        run: |
          cd packages/mediapipe-task-text
          dart pub get
          cd ../..
          make models_text
          python3 -B packages/mediapipe-task-text/tool/prepare_classic_text_reference.py
      - name: Verify public downloads and debug/release task coexistence
        run: python3 -B packages/mediapipe-task-text/tool/test_embedding_macos.py
      - name: Prepare the text demos and check callback ownership
        run: |
          cd packages/mediapipe-task-text
          dart pub get
          cd ../..
          make models_text
          make models_embedding
          make models_proofreader
          make models_summarizer
          make test_text_stream_bridge
          make test_text
      - name: Test official references, lifecycle and the macOS UI
        working-directory: packages/mediapipe-task-text/example_embedding
        run: |
          flutter pub get
          dart test --reporter expanded
          flutter test -d macos integration_test/demo_test.dart --reporter expanded
      - name: Test the migrated BERT, USE and language demo
        working-directory: packages/mediapipe-task-text/example
        run: |
          flutter pub get
          flutter test --reporter expanded
          flutter test -d macos integration_test/text_tasks_test.dart --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedding-gemma-validation
          path: |
            build/codex-tmp/embedding-consumer-*/report.json
            build/codex-tmp/embedding-consumer-*/*.log
            build/classic-text-reference/*.json
            build/classic-text-reference/*.log
          if-no-files-found: error

  native-tasks:
    name: Stable Flutter / macOS arm64
    runs-on: macos-15
    # A cold source build plus all Flutter builds can exceed one hour.
    timeout-minutes: 90
    env:
      MEDIAPIPE_GPU_REFERENCE_DIR: ${{ github.workspace }}/build/gpu-reference
      MEDIAPIPE_CLASSIC_TEXT_REFERENCE_DIR: ${{ github.workspace }}/build/classic-text-reference
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter --version
      - run: brew install bazelisk cmake ninja
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make get models
      - name: Generate official CPU text references on this runner
        run: python3 -B packages/mediapipe-task-text/tool/prepare_classic_text_reference.py
      - name: Generate official GPU references on this runner
        # This job runs every suite with MEDIAPIPE_GPU_REFERENCE_DIR set, so it
        # needs the Object Detector references too; `make models` supplied them.
        run: python3 -B packages/mediapipe-task-vision/tool/prepare_gpu_reference.py --object-detector
      # make get/models already ran above for the independent references.
      # Keep the remaining make ci checks, with visible stage boundaries.
      - name: Build official native face tasks from source
        run: make native_vision
      - name: Analyze, format-check and test all packages
        run: |
          make analyze
          make check_format
          make test_only
      - name: Build the text, camera and segmenter apps
        run: |
          make build_text
          make build_vision_camera
          make build_segmenter
      - name: Test source-built face tasks in a fresh Flutter app
        run: make test_vision_flutter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-gpu-reference-source-build
          path: |
            build/gpu-reference/**/*.json
            build/gpu-reference/*.log
            build/classic-text-reference/*.json
            build/classic-text-reference/*.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mediapipe-face-tasks-1.0.0-macos-arm64
          path: packages/mediapipe-task-vision/build/native/**/*.tar.gz
          if-no-files-found: error

  official-runtime-pin:
    name: Official macOS landmark runtime / pin survives this runner's Xcode
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the official runtime and check the unsigned-image pin
        # The prepared dylib is re-signed by whichever Xcode is present. The
        # pin covers the unsigned image, so this must pass on every Xcode; the
        # manifest records which one signed it.
        run: |
          xcodebuild -version | head -1
          python3 -B packages/mediapipe-task-vision/tool/prepare_official_macos_landmark_runtime.py \
            | python3 -c "import json,sys; t=sys.stdin.read(); m=json.loads(t[t.index('{'):])['manifest']; print('signed', m['sha256'][:16], 'unsigned', m['unsigned_sha256'][:16], m['signing_toolchain'])"

  prebuilt-consumer:
    name: Fresh Flutter consumer / public runtime download
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Download the test model
        working-directory: packages/mediapipe-task-vision
        run: |
          dart pub get
          dart tool/download_model.dart
          dart tool/download_face_landmarker.dart
      - name: Test public download and debug/release inference without native build tools
        working-directory: packages/mediapipe-task-vision
        run: python3 tool/test_prebuilt_macos.py

  gpu-reference:
    name: Official GPU comparison / same macOS runner
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the official face models
        working-directory: packages/mediapipe-task-vision
        run: |
          dart pub get
          dart tool/download_model.dart
          dart tool/download_face_landmarker.dart
      - name: Compare public native tasks with the official wheel on this runner
        run: python3 -B packages/mediapipe-task-vision/tool/prepare_gpu_reference.py --test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-gpu-reference-prebuilt
          path: |
            build/gpu-reference/**/*.json
            build/gpu-reference/*.log
          if-no-files-found: error

  segmenter-consumer:
    name: MagicTouch / fresh macOS consumer
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Download the official MagicTouch model
        working-directory: packages/mediapipe-task-vision
        run: |
          dart pub get
          dart tool/download_interactive_segmenter.dart
      - name: Verify public download, debug/release inference and CPU timings
        working-directory: packages/mediapipe-task-vision
        run: python3 -B tool/test_segmenter_macos.py
      - name: Prepare the macOS editor assets
        working-directory: packages/mediapipe-task-vision
        run: python3 -B tool/prepare_segmenter_example.py
      - name: Test the real macOS editor
        working-directory: packages/mediapipe-task-vision/example_segmenter
        run: |
          flutter pub get
          flutter test --reporter expanded
          flutter test -d macos integration_test/editor_test.dart --reporter expanded
      - uses: actions/upload-artifact@v4
        with:
          name: interactive-segmenter-validation
          path: |
            build/segmenter-consumer-*/report.json
            build/segmenter-consumer-*/release.log
          if-no-files-found: error
