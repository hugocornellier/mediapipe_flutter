name: macOS tasks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  native-tasks:
    name: Stable Flutter / macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter --version
      - run: brew install bazelisk cmake ninja
      - run: make ci
      - uses: actions/upload-artifact@v4
        with:
          name: mediapipe-face-detector-1.0.0-macos-arm64
          path: packages/mediapipe-task-vision/build/native/mediapipe-face-detector-1.0.0-macos-arm64.tar.gz
          if-no-files-found: error
