name: Desktop GPU probe (official runtime, software GPUs)

# Manual. Asks whether Google's official MediaPipe runtime from PyPI can run
# Face Landmarker on the GPU delegate on Linux and Windows, using hosted
# runners' software GPUs: Mesa's llvmpipe (OpenGL ES) and lavapipe (Vulkan) on
# Linux, WARP (Direct3D 12) on Windows. It proves the path works, not speed.
#
# Results: packages/mediapipe-task-vision/tool/validations/2026-09-23-desktop-gpu.
# 1.0.0 is built with GPU disabled on both systems. 1.0.1's Linux library links
# EGL and OpenGL ES but refuses software renderers by name ("GPU emulation
# detected"); a Linux step renames Mesa's renderer so its unmodified GPU path
# runs anyway. The Windows library embeds no GPU
# backend but loads LiteRT accelerator plug-ins by name, so each job also tries
# Google's WebGPU accelerator from the ai-edge-litert wheel, placed where it
# can be found.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mediapipe_version:
        description: mediapipe version to install from PyPI
        default: '1.0.1'
        required: true

env:
  MEDIAPIPE_VERSION: ${{ inputs.mediapipe_version }}
  MODEL_URL: https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
  MODEL_SHA256: 64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff
  GLOG_logtostderr: '1'

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64, llvmpipe (OpenGL ES) and lavapipe (Vulkan)
            os: ubuntu-24.04
            # Mesa's headless EGL platform; hosted runners have no display.
            egl: surfaceless
          - name: Windows x64, WARP (Direct3D 12)
            os: windows-2025
    env:
      EGL_PLATFORM: ${{ matrix.egl }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packages/mediapipe-task-vision/test/fixtures/face_detection

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Software GPU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # Since 1.0.1 the Linux library links libEGL/libGLESv2 (GPU enabled).
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools libegl1 libgles2 \
            libegl-mesa0 libgl1-mesa-dri mesa-utils > /dev/null
          vulkaninfo --summary 2>&1 | grep -E "deviceName|driverName|apiVersion|deviceType" || vulkaninfo --summary
          eglinfo -B -p surfaceless 2>&1 | grep -iE "version|renderer|vendor" | head -8 || true

      - name: Install the official wheel, model and probe
        run: |
          python -m pip install --quiet "mediapipe==$MEDIAPIPE_VERSION" numpy
          python -c "import mediapipe, platform; print('mediapipe', mediapipe.__version__, '|', platform.platform())"
          mkdir -p probe && cd probe
          curl -sSfL -o face_landmarker.task "$MODEL_URL"
          python -c "import hashlib,sys; h=hashlib.sha256(open('face_landmarker.task','rb').read()).hexdigest(); print(h); sys.exit(h != '$MODEL_SHA256')"
          cp ../packages/mediapipe-task-vision/test/fixtures/face_detection/landmark-ex1.jpg portrait.jpg
          cat > probe.py <<'EOF'
          """Face Landmarker IMAGE mode on one delegate; writes landmarks and timings."""
          import json, statistics, sys, time
          import mediapipe as mp
          from mediapipe.tasks import python
          from mediapipe.tasks.python import vision

          delegate, out = sys.argv[1], sys.argv[2]
          options = vision.FaceLandmarkerOptions(
              base_options=python.BaseOptions(
                  model_asset_path='face_landmarker.task',
                  delegate=getattr(python.BaseOptions.Delegate, delegate.upper())),
              num_faces=1)
          started = time.perf_counter()
          with vision.FaceLandmarker.create_from_options(options) as task:
              created = time.perf_counter()
              image = mp.Image.create_from_file('portrait.jpg')
              result = task.detect(image)
              first = time.perf_counter()
              times = []
              for _ in range(30):
                  begin = time.perf_counter()
                  result = task.detect(image)
                  times.append((time.perf_counter() - begin) * 1000)
          faces = result.face_landmarks
          report = {
              'delegate': delegate, 'faces': len(faces),
              'landmarks': [[p.x, p.y, p.z] for p in faces[0]] if faces else [],
              'create_ms': (created - started) * 1000, 'first_ms': (first - created) * 1000,
              'median_ms': statistics.median(times),
          }
          json.dump(report, open(out, 'w'))
          print(f"OK {delegate}: {report['faces']} face(s), {len(report['landmarks'])} landmarks, "
                f"create {report['create_ms']:.0f} ms, first {report['first_ms']:.0f} ms, "
                f"median {report['median_ms']:.2f} ms")
          EOF
          cat > compare.py <<'EOF'
          """Largest and mean landmark distance between two probe results."""
          import json, math, sys
          a, b = (json.load(open(path)) for path in sys.argv[1:3])
          if not a['landmarks'] or not b['landmarks']:
              sys.exit('a result has no landmarks')
          gaps = [math.dist(p[:2], q[:2]) for p, q in zip(a['landmarks'], b['landmarks'])]
          print(f"{sys.argv[2]} vs {sys.argv[1]}: max {max(gaps):.5f}, mean {sum(gaps) / len(gaps):.5f} "
                f"(normalized x,y over {len(gaps)} landmarks)")
          EOF

      - name: CPU (control)
        working-directory: probe
        run: python -B probe.py cpu cpu.json 2>&1 | tee cpu.log

      - name: GPU, official wheel only
        working-directory: probe
        run: |
          set +e
          python -B probe.py gpu gpu.json > gpu.log 2>&1
          echo "exit=$?" | tee gpu.exit
          grep -iE "^OK|accelerator|webgpu|dawn|vulkan|d3d|adapter|gpu|error|Traceback" gpu.log | tail -25
          [ -f gpu.json ] && python compare.py cpu.json gpu.json | tee -a gpu.log || true

      - name: GPU with Mesa's renderer renamed (Linux)
        if: runner.os == 'Linux'
        working-directory: probe
        env:
          # 1.0.1 refuses GL_RENDERER names containing llvmpipe or softpipe.
          # Mesa's force_gl_renderer option renames the same software renderer
          # so the unmodified GPU path runs; this tests its results, not
          # Google's support for software GPUs.
          force_gl_renderer: Mesa software rasterizer, renamed for a MediaPipe CI test
        run: |
          set +e
          python -B probe.py gpu gpu-renamed.json > gpu-renamed.log 2>&1
          echo "exit=$?" | tee gpu-renamed.exit
          grep -iE "^OK|GL version|overridden|delegate|error|Traceback" gpu-renamed.log | tail -25
          [ -f gpu-renamed.json ] && python compare.py cpu.json gpu-renamed.json | tee -a gpu-renamed.log || true

      - name: GPU with Google's WebGPU accelerator plug-in
        working-directory: probe
        run: |
          set +e
          library=$(python -c "import mediapipe, os; print(os.path.join(os.path.dirname(mediapipe.__file__), 'tasks', 'c'))")
          for litert in 2.1.6 2.2.0; do
            rm -rf plugin && python -m pip download --quiet --no-deps --only-binary=:all: -d plugin "ai-edge-litert==$litert"
            python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('plugin/*.whl')[0]); [z.extract(n,'plugin') for n in z.namelist() if 'WebGpuAccelerator' in n or n.split('/')[-1] in ('libLiteRt.so','libLiteRt.dll')]"
            accelerator=$(find plugin -name '*WebGpuAccelerator*' | head -1)
            echo "== ai-edge-litert $litert: ${accelerator:-no accelerator in wheel}"
            [ -n "$accelerator" ] || continue
            # Next to libmediapipe, next to python (Windows searches the
            # application directory) and on the platform's search path.
            cp "$accelerator" "$library/"
            [ "$RUNNER_OS" = Windows ] && cp "$accelerator" "$(dirname "$(which python)")/"
            PATH="$library:$PATH" LD_LIBRARY_PATH="$library" python -B probe.py gpu "gpu-$litert.json" > "gpu-$litert.log" 2>&1
            echo "exit=$?" | tee "gpu-$litert.exit"
            grep -iE "^OK|accelerator|webgpu|dawn|vulkan|d3d|adapter|error|Traceback" "gpu-$litert.log" | tail -20
            [ -f "gpu-$litert.json" ] && python compare.py cpu.json "gpu-$litert.json" | tee -a "gpu-$litert.log"
            rm -f "$library/$(basename "$accelerator")"
            [ "$RUNNER_OS" = Windows ] && rm -f "$(dirname "$(which python)")/$(basename "$accelerator")"
          done
          true

      - name: Summarize
        if: always()
        working-directory: probe
        run: |
          {
            echo "## ${{ matrix.name }}, mediapipe $MEDIAPIPE_VERSION"
            for run in cpu gpu gpu-renamed gpu-2.1.6 gpu-2.2.0; do
              [ -f "$run.log" ] || continue
              echo
              echo "### $run $(cat "$run.exit" 2>/dev/null)"
              echo '```'
              grep -E "^OK|vs cpu.json" "$run.log" || grep -iE "error|accelerator|RuntimeError" "$run.log" | tail -6 || tail -6 "$run.log"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-gpu-probe-${{ runner.os }}
          path: |
            probe/*.log
            probe/*.exit
            probe/*.json
