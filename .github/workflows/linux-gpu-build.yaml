name: Linux GPU runtime build (proof of concept)

# Manual. Google's Linux wheel cannot show its GPU delegate on a hosted
# runner: 1.0.0 is built with MEDIAPIPE_DISABLE_GPU, and 1.0.1 is built with
# GPU but refuses software renderers ("GPU emulation detected") when it
# creates its GL context. This builds the same pinned, unmodified upstream
# v1.0.0 source the macOS runtime uses, which has no such check, with the GPU
# options Google's own setup.py applies when MEDIAPIPE_DISABLE_GPU=0 and
# OpenCV from source as the wheel does, then runs Face Landmarker on CPU and
# GPU against Mesa's software OpenGL ES (llvmpipe). It proves the GPU path,
# not its speed. Upstream links that OpenCV as shared libraries (the wheel's
# setup.py switches it to static), so they travel next to libmediapipe.so.
# A first build takes about 45 minutes; one served from the disk cache, 3.
# Results: packages/mediapipe-task-vision/tool/validations/2026-09-23-desktop-gpu.

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  MEDIAPIPE_REVISION: 6d31f1ebc3284db74d211d62bdc4f0a0c29ea120
  MODEL_URL: https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
  MODEL_SHA256: 64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff
  GLOG_logtostderr: '1'

jobs:
  build:
    name: Build libmediapipe.so with GPU, test on llvmpipe
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            packages/mediapipe-task-vision/tool
            packages/mediapipe-task-vision/test/fixtures/face_detection

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: EGL and OpenGL ES (Mesa)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgles2-mesa-dev mesa-common-dev mesa-utils > /dev/null
          df -h / | tail -1
          nproc; free -g | head -2

      - name: Upstream source, pinned and unmodified
        run: |
          git init -q mediapipe && cd mediapipe
          git remote add origin https://github.com/google-ai-edge/mediapipe.git
          git fetch -q --depth 1 origin "$MEDIAPIPE_REVISION"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$MEDIAPIPE_REVISION"
          test -z "$(git status --porcelain)"
          cat .bazelversion

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/mediapipe-disk-cache
          key: linux-gpu-${{ env.MEDIAPIPE_REVISION }}-${{ github.run_id }}
          restore-keys: linux-gpu-${{ env.MEDIAPIPE_REVISION }}-

      - name: Build //mediapipe/tasks/c:libmediapipe.so with GPU
        id: build
        working-directory: mediapipe
        run: |
          # Google's setup.py: GPU_OPTIONS_ENABLED and --define=OPENCV=source.
          # OpenCV is a top-level target too: on disk cache hits Bazel 7 writes
          # only top-level outputs, and libmediapipe.so needs its libraries.
          bazelisk build --compilation_mode=opt --copt=-DNDEBUG --strip=always \
            --repo_env=HERMETIC_PYTHON_VERSION=3.12 --define=OPENCV=source \
            --copt=-DTFLITE_GPU_EXTRA_GLES_DEPS --copt=-DMEDIAPIPE_OMIT_EGL_WINDOW_BIT \
            --copt=-DMESA_EGL_NO_X11_HEADERS --copt=-DEGL_NO_X11 \
            --jobs=4 --disk_cache="$HOME/.cache/mediapipe-disk-cache" \
            //mediapipe/tasks/c:libmediapipe.so //third_party:opencv_cmake
          library=bazel-bin/mediapipe/tasks/c/libmediapipe.so
          ls -la "$library"
          echo "== dynamic dependencies"; readelf -d "$library" | grep NEEDED
          readelf -d "$library" | grep -qE "libEGL|libGLESv2" || { echo "::error::library links no EGL/GLES"; exit 1; }
          # Tracked files only: Bazel writes MODULE.bazel.lock, which upstream does not ignore.
          test -z "$(git status --porcelain --untracked-files=no)" || { git status --short; echo "::error::upstream source changed"; exit 1; }

      - uses: actions/cache/save@v4
        if: always() && steps.build.conclusion != 'skipped'
        with:
          path: ~/.cache/mediapipe-disk-cache
          key: linux-gpu-${{ env.MEDIAPIPE_REVISION }}-${{ github.run_id }}

      - name: Model and portrait
        run: |
          mkdir -p probe && cd probe
          curl -sSfL -o face_landmarker.task "$MODEL_URL"
          echo "$MODEL_SHA256  face_landmarker.task" | sha256sum -c -
          cp ../packages/mediapipe-task-vision/test/fixtures/face_detection/landmark-ex1.jpg portrait.jpg
          cp ../mediapipe/bazel-bin/mediapipe/tasks/c/libmediapipe.so .
          cp -L ../mediapipe/bazel-bin/third_party/opencv_cmake/lib/libopencv_*.so.3.4 .
          if LD_LIBRARY_PATH="$PWD" ldd libmediapipe.so | grep "not found"; then
            echo "::error::libmediapipe.so has unresolved libraries"; exit 1
          fi
          eglinfo -B -p surfaceless 2>&1 | grep -iE "version|renderer|vendor" | head -8 || true

      - name: C smoke, CPU and GPU
        working-directory: probe
        run: |
          # libmediapipe.so finds upstream's shared OpenCV libraries here.
          export LD_LIBRARY_PATH="$PWD${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          g++ -std=c++17 -I ../mediapipe ../packages/mediapipe-task-vision/tool/native_landmarker_smoke.cc \
            libmediapipe.so -Wl,-rpath,'$ORIGIN' -Wl,-rpath-link,. -o smoke
          ./smoke face_landmarker.task portrait.jpg cpu 2>&1 | tee smoke-cpu.log
          set +e
          for platform in default surfaceless; do
            if [ $platform = default ]; then ./smoke face_landmarker.task portrait.jpg gpu > smoke-gpu-$platform.log 2>&1
            else EGL_PLATFORM=surfaceless ./smoke face_landmarker.task portrait.jpg gpu > smoke-gpu-$platform.log 2>&1; fi
            echo "exit=$?" | tee smoke-gpu-$platform.exit
            grep -iE "Official Face Landmarker|delegate|-based API|GL version|renderer|EGL|error|failed" smoke-gpu-$platform.log | sort -u | head -20
          done
          true

      - name: Python API with this library, CPU and GPU landmarks compared
        working-directory: probe
        run: |
          # Keep setup-python's own library path; add upstream's OpenCV.
          export LD_LIBRARY_PATH="$PWD${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python -m pip install --quiet mediapipe==1.0.0 numpy
          target=$(python -c "import mediapipe, os; print(os.path.join(os.path.dirname(mediapipe.__file__), 'tasks', 'c'))")
          cp libmediapipe.so "$target/libmediapipe.so"
          cat > probe.py <<'EOF'
          """Face Landmarker IMAGE mode on one delegate; writes landmarks and timings."""
          import json, statistics, sys, time
          import mediapipe as mp
          from mediapipe.tasks import python
          from mediapipe.tasks.python import vision

          delegate, out = sys.argv[1], sys.argv[2]
          options = vision.FaceLandmarkerOptions(
              base_options=python.BaseOptions(
                  model_asset_path='face_landmarker.task',
                  delegate=getattr(python.BaseOptions.Delegate, delegate.upper())),
              num_faces=1)
          started = time.perf_counter()
          with vision.FaceLandmarker.create_from_options(options) as task:
              created = time.perf_counter()
              image = mp.Image.create_from_file('portrait.jpg')
              result = task.detect(image)
              first = time.perf_counter()
              times = []
              for _ in range(30):
                  begin = time.perf_counter()
                  result = task.detect(image)
                  times.append((time.perf_counter() - begin) * 1000)
          faces = result.face_landmarks
          report = {
              'delegate': delegate, 'faces': len(faces),
              'landmarks': [[p.x, p.y, p.z] for p in faces[0]] if faces else [],
              'create_ms': (created - started) * 1000, 'first_ms': (first - created) * 1000,
              'median_ms': statistics.median(times),
          }
          json.dump(report, open(out, 'w'))
          print(f"OK {delegate}: {report['faces']} face(s), {len(report['landmarks'])} landmarks, "
                f"create {report['create_ms']:.0f} ms, first {report['first_ms']:.0f} ms, "
                f"median {report['median_ms']:.2f} ms")
          EOF
          cat > compare.py <<'EOF'
          """Largest and mean landmark distance between two probe results."""
          import json, math, sys
          a, b = (json.load(open(path)) for path in sys.argv[1:3])
          if not a['landmarks'] or not b['landmarks']:
              sys.exit('a result has no landmarks')
          gaps = [math.dist(p[:2], q[:2]) for p, q in zip(a['landmarks'], b['landmarks'])]
          print(f"{sys.argv[2]} vs {sys.argv[1]}: max {max(gaps):.5f}, mean {sum(gaps) / len(gaps):.5f} "
                f"(normalized x,y over {len(gaps)} landmarks)")
          EOF
          python -B probe.py cpu cpu.json 2>&1 | tee python-cpu.log
          set +e
          EGL_PLATFORM=surfaceless python -B probe.py gpu gpu.json > python-gpu.log 2>&1
          echo "exit=$?" | tee python-gpu.exit
          grep -iE "^OK|delegate|-based API|GL version|renderer|error|Traceback|disabled" python-gpu.log | sort -u | head -20
          [ -f gpu.json ] && python compare.py cpu.json gpu.json | tee -a python-gpu.log
          true

      - name: Summarize
        if: always() && steps.build.outcome == 'success'
        working-directory: probe
        run: |
          {
            echo "## Linux libmediapipe.so with GPU, upstream ${MEDIAPIPE_REVISION:0:8}"
            echo '```'
            ls -la libmediapipe.so libopencv_*.so.3.4 2>/dev/null || true
            du -ch libmediapipe.so libopencv_*.so.3.4 2>/dev/null | tail -1
            readelf -d libmediapipe.so 2>/dev/null | grep NEEDED
            echo '```'
            for log in smoke-cpu smoke-gpu-default smoke-gpu-surfaceless python-cpu python-gpu; do
              [ -f "$log.log" ] || continue
              echo "### $log $(cat "$log.exit" 2>/dev/null)"
              echo '```'
              grep -iE "^OK|Official Face Landmarker|delegate for|with delegate|-based API|renderer|vs cpu.json|disabled in build" "$log.log" | sort -u | head -8
              grep -iE "error|failed" "$log.log" | sed -E 's/^[IWE][0-9]{4} [0-9:. ]+ [0-9]+ //' | sort -u | head -4
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-gpu-runtime
          retention-days: 14
          path: |
            probe/*.log
            probe/*.exit
            probe/*.json
            probe/libmediapipe.so
            probe/libopencv_*.so.3.4
