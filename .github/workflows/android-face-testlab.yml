name: Android devices (Firebase Test Lab)

# Temporary, on the branch test/jni-phone only: integration_test/jni_phone_test.dart
# alone, on one physical Pixel 8a, for whether JNI_OnLoad called from Dart
# restores the usage uploader. Keeps this file name and the devices input: GitHub
# lists a dispatchable workflow only when the default branch holds a file of that
# name, and refuses an input the branch's copy does not declare.
on:
  workflow_dispatch:
    inputs:
      devices:
        description: Must be akita, the one device this branch runs
        required: false
        default: akita

permissions:
  contents: read

concurrency:
  group: android-devices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jni-phone:
    name: JNI_OnLoad from Dart / Pixel 8a (akita API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FIREBASE_PROJECT_ID: flutter-litert
      RESULTS_BUCKET: test-lab-7yqvc8ruj90y2-k9u7wfunxj2sa
      RESULTS_DIR: mediapipe-jni-phone-${{ github.run_id }}-${{ github.run_attempt }}-akita
      MODEL: akita
      VERSION: '35'
      ABI: arm64-v8a
      DEVICE: akita-35-en-portrait
    steps:
      - name: Only the one device
        env:
          WANTED: ${{ inputs.devices }}
        run: test "$WANTED" = akita
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup
      # Gradle's own NDK and CMake downloads give up on one corrupt archive.
      - uses: ./.github/actions/android-ndk
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
      # Checked before building, so a typo costs minutes rather than a run.
      - name: Verify physical device
        run: |
          gcloud firebase test android models describe "$MODEL" --project "$FIREBASE_PROJECT_ID" --format=json > device.json
          python3 -c 'import json, os; d = json.load(open("device.json")); assert d["form"] == "PHYSICAL", d["form"]; assert os.environ["VERSION"] in d["supportedVersionIds"], d["supportedVersionIds"]; assert os.environ["ABI"] in d["supportedAbis"], d["supportedAbis"]'
      # Language Detector, and the one vision task the vision hook needs.
      - name: Prepare the gallery
        run: |
          dart run tool/gallery_builder/bin/prepare_gallery.dart --target android/arm64 --tasks language_detector,image_embedder
          cd gallery && flutter pub get
      - name: Build the app and instrumentation APKs
        working-directory: gallery
        run: |
          target="$PWD/integration_test/jni_phone_test.dart"
          flutter build apk --config-only --debug --target "$target" --target-platform android-arm64
          cd android
          ./gradlew app:assembleAndroidTest -Pmediapipe.testLabAbi="$ABI"
          ./gradlew app:assembleDebug -Ptarget="$target" -Ptarget-platform=android-arm64 \
            -Pmediapipe.testLabAbi="$ABI"
      # Before the run is spent: the 1.2.2 text library, exporting JNI_OnLoad.
      - name: Verify packaged runtime and pin
        run: |
          grep -q "^const familyRuntimeVersion = '1.2.2';" packages/mediapipe-core/lib/src/native_assets/family_runtimes.dart
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          with zipfile.ZipFile('gallery/build/app/outputs/apk/debug/app-debug.apk') as apk:
              names = set(apk.namelist())
              library = f"lib/{os.environ['ABI']}/libmediapipe_tasks_text.so"
              required = {library, f"lib/{os.environ['ABI']}/libflutter.so"}
              assert required <= names, sorted(required - names)
              data = apk.read(library)
              tasks = json.loads(apk.read('assets/flutter_assets/assets/manifest.json'))['tasks']
          assert 'language_detector' in tasks, tasks
          assert b'JNI_OnLoad' in data, 'no JNI_OnLoad'
          print('text library sha256', hashlib.sha256(data).hexdigest(), 'bytes', len(data))
          print('tasks', tasks)
          PY
      # One device, no shards or flaky retries: one execution from the daily budget.
      - name: Run the one test
        id: testlab
        run: >-
          gcloud firebase test android run
          --project "$FIREBASE_PROJECT_ID" --type instrumentation
          --app gallery/build/app/outputs/apk/debug/app-debug.apk
          --test gallery/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          --device "model=$MODEL,version=$VERSION,locale=en,orientation=portrait"
          --timeout 15m --results-history-name mediapipe-vision-sdk-android
          --results-bucket "$RESULTS_BUCKET" --results-dir "$RESULTS_DIR"
      - name: Download test artifacts
        if: always()
        run: |
          mkdir -p testlab-results
          for name in logcat instrumentation.results test_result_1.xml; do
            gcloud storage cp "gs://$RESULTS_BUCKET/$RESULTS_DIR/$DEVICE/$name" testlab-results/ || true
          done
          grep -hE 'JNI_PHONE_|Failed to get JNIEnv|AttachWorkerPoolThreadToJvm' testlab-results/logcat > testlab-results/jni_phone.log || true
          gzip -k testlab-results/logcat || true
          rm -f testlab-results/logcat
          ls -la testlab-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-jni-phone-akita-35
          path: testlab-results/
          if-no-files-found: ignore
