name: Android FaceLandmarker (Firebase Test Lab)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-face-testlab
  cancel-in-progress: false

jobs:
  face-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: flutter-litert
      RESULTS_BUCKET: test-lab-7yqvc8ruj90y2-k9u7wfunxj2sa
      RESULTS_DIR: mediapipe-face-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare FaceLandmarker gallery
        run: python3 gallery/tool/prepare.py --target android/arm64 --tasks face_landmarker
      - name: Resolve dependencies
        working-directory: gallery
        run: flutter pub get
      - name: Configure Android build
        working-directory: gallery
        run: flutter build apk --config-only --debug --target integration_test/android_face_landmarker_test.dart --target-platform android-arm64
      - name: Build instrumentation APK
        working-directory: gallery/android
        run: ./gradlew app:assembleAndroidTest -Pmediapipe.testLabAbi=arm64-v8a
      - name: Build face SDK test APK
        working-directory: gallery/android
        run: ./gradlew app:assembleDebug -Ptarget=${{ github.workspace }}/gallery/integration_test/android_face_landmarker_test.dart -Ptarget-platform=android-arm64 -Pmediapipe.testLabAbi=arm64-v8a
      - name: Verify packaged native runtime and model
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('gallery/build/app/outputs/apk/debug/app-debug.apk') as apk:
              names = set(apk.namelist())
              required = {'lib/arm64-v8a/libflutter.so',
                          'lib/arm64-v8a/libmediapipe_tasks_jni.so',
                          'assets/flutter_assets/assets/models/face_landmarker.task'}
              assert required <= names, required - names
              assert not any('libmediapipe.so' in name for name in names), 'Duplicate source runtime'
          PY
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
      - name: Verify physical device
        run: |
          gcloud firebase test android models describe panther --project "$FIREBASE_PROJECT_ID" --format=json > device.json
          python3 -c 'import json; d=json.load(open("device.json")); assert d["form"] == "PHYSICAL" and "33" in d["supportedVersionIds"]'
      # One device, no shards or flaky retries: one execution from the daily budget.
      - name: Run CPU and GPU face and camera tests
        run: >-
          gcloud firebase test android run
          --project "$FIREBASE_PROJECT_ID" --type instrumentation
          --app gallery/build/app/outputs/apk/debug/app-debug.apk
          --test gallery/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          --device model=panther,version=33,locale=en,orientation=portrait
          --timeout 8m --results-history-name mediapipe-face-landmarker-android
          --results-bucket "$RESULTS_BUCKET" --results-dir "$RESULTS_DIR"
      - name: Download test artifacts
        if: always()
        run: |
          mkdir -p testlab-results
          gcloud storage cp "gs://$RESULTS_BUCKET/$RESULTS_DIR/panther-33-en-portrait/logcat" testlab-results/ || true
          gcloud storage cp "gs://$RESULTS_BUCKET/$RESULTS_DIR/panther-33-en-portrait/instrumentation.results" testlab-results/ || true
          gcloud storage cp "gs://$RESULTS_BUCKET/$RESULTS_DIR/panther-33-en-portrait/test_result_1.xml" testlab-results/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-face-testlab-results
          path: testlab-results/
          if-no-files-found: ignore
