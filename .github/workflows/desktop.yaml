name: Desktop tasks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push on the same branch supersedes the queued matrix; the hosted
# macOS pool is small enough that stale runs otherwise starve the latest one.
concurrency:
  group: desktop-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  face-tasks:
    name: Vision tasks / ${{ matrix.os }} x64 CPU
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Flutter host dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good libegl1 libgles2
      - name: Validate Linux CPU references and debug/release consumers
        id: linux_cpu
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 -B packages/mediapipe-task-vision/tool/test_desktop.py --object-detector --image-tasks --landmark-tasks --segmenter-tasks --interactive-segmenter
      - name: Record linux CPU task coverage (linux-cpu)
        if: always() && runner.os == 'Linux'
        run: python3 -B tool/coverage/record.py --suite linux-cpu --platform linux --delegate cpu --tasks face_detector,face_landmarker,gesture_recognizer,hand_landmarker,holistic_landmarker,image_classifier,image_embedder,image_segmenter,interactive_segmenter,object_detector,pose_landmarker --outcome ${{ steps.linux_cpu.outcome }}
      # Core's shared runtime here is the vision package's wheel library; the
      # suites compare with Google's Python on this runner.
      - name: Text and audio against Google's Linux wheel
        id: linux_text_audio
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: python3 -B tool/test_text_audio.py
      - name: Record linux CPU text and audio coverage (linux-text-audio)
        if: always() && runner.os == 'Linux'
        run: python3 -B tool/coverage/record.py --suite linux-text-audio --platform linux --delegate cpu --tasks audio_classifier,language_detector,text_classifier,text_embedder --outcome ${{ steps.linux_text_audio.outcome }}
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: coverage-linux-cpu
          path: build/coverage/
          if-no-files-found: error
      # Google's Windows runtime uploads usage logs to play.googleapis.com and
      # a task's close waits for that upload, which on hosted runners
      # sometimes takes 20 to 34 s, past the tests' 30 s timeouts
      # (upstream-issues.md UP-025). The tests must not depend on Google's
      # logging service, so its name resolves to an unroutable address here.
      - name: Keep Google's usage logging off the network
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content "$env:SystemRoot\System32\drivers\etc\hosts" "`n0.0.0.0 play.googleapis.com`n:: play.googleapis.com"
          ipconfig /flushdns | Out-Null
      - name: Validate Windows CPU references and debug/release consumers
        id: windows_cpu
        if: runner.os == 'Windows'
        run: python -B packages/mediapipe-task-vision/tool/test_desktop.py --object-detector --image-tasks --landmark-tasks --segmenter-tasks
      - name: Record windows CPU task coverage (windows-cpu)
        if: always() && runner.os == 'Windows'
        run: python -B tool/coverage/record.py --suite windows-cpu --platform windows --delegate cpu --tasks face_detector,face_landmarker,gesture_recognizer,hand_landmarker,holistic_landmarker,image_classifier,image_embedder,image_segmenter,object_detector,pose_landmarker --outcome ${{ steps.windows_cpu.outcome }}
      - name: Text and audio against Google's Windows wheel
        id: windows_text_audio
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: python -B tool/test_text_audio.py
      - name: Record windows CPU text and audio coverage (windows-text-audio)
        if: always() && runner.os == 'Windows'
        run: python -B tool/coverage/record.py --suite windows-text-audio --platform windows --delegate cpu --tasks audio_classifier,language_detector,text_classifier,text_embedder --outcome ${{ steps.windows_text_audio.outcome }}
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: coverage-windows-cpu
          path: build/coverage/
          if-no-files-found: error
      - name: Build and exercise the Linux CPU gallery
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 -B gallery/tool/test_desktop.py
      - name: Build and exercise the Windows CPU gallery
        if: runner.os == 'Windows'
        run: python -B gallery/tool/test_desktop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-cpu-${{ matrix.os }}
          path: |
            build/codex-tmp/desktop-*/*.log
            build/codex-tmp/desktop-*/report.json
            build/codex-tmp/desktop-*/reference/**/*.json
            build/codex-tmp/gallery-desktop-*/*.log
            build/codex-tmp/gallery-desktop-*/report.json
            build/codex-tmp/text-audio/*.log
            build/codex-tmp/text-audio/report.json
            build/classic-text-reference/*.json
            build/classic-text-reference/*.log
            build/audio-reference/*.json
            build/audio-reference/*.log
          if-no-files-found: error

  linux-gpu:
    name: Vision tasks / ubuntu-24.04 x64 GPU (Mesa, renamed renderer)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MEDIAPIPE_GPU_REFERENCE_DIR: ${{ github.workspace }}/build/gpu-reference
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mesa's EGL and OpenGL ES, and the Flutter Linux host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri \
            clang cmake ninja-build pkg-config libgtk-3-dev xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good
      - name: Download the vision models
        working-directory: packages/mediapipe-task-vision
        run: |
          dart pub get
          dart tool/download_model.dart
          dart tool/download_face_landmarker.dart
          dart tool/download_landmark_tasks.dart
          dart tool/download_object_detector.dart
          dart tool/download_image_tasks.dart
          dart tool/download_segmenter_tasks.dart
      - name: Official 1.0.1 GPU references and Dart GPU suites on llvmpipe
        id: linux_gpu
        env:
          # Google's runtime refuses renderers named llvmpipe or softpipe.
          # Mesa's force_gl_renderer renames the same software renderer, so
          # the unmodified GPU path runs. This checks results against Google's
          # own GPU output on this runner, not support for software GPUs.
          force_gl_renderer: Mesa software rasterizer, renamed for a MediaPipe CI test
          # Without a display the default EGL platform fails.
          EGL_PLATFORM: surfaceless
        run: >-
          python3 -B packages/mediapipe-task-vision/tool/prepare_gpu_reference.py --test
          --landmark-tasks --object-detector --image-tasks --segmenter-tasks
      - name: Record linux GPU task coverage (linux-gpu)
        if: always()
        run: python3 -B tool/coverage/record.py --suite linux-gpu --platform linux --delegate gpu --tasks face_detector,face_landmarker,gesture_recognizer,hand_landmarker,image_classifier,image_segmenter,object_detector,pose_landmarker --outcome ${{ steps.linux_gpu.outcome }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-linux-gpu
          path: build/coverage/
          if-no-files-found: error
      - name: Without the rename, the refused GPU is reported and not replaced
        working-directory: build/gpu-face-tests
        env:
          MEDIAPIPE_EXPECT_GPU_REFUSAL: '1'
          EGL_PLATFORM: surfaceless
        run: dart test test/face_landmarker_test.dart --name 'a refused GPU is reported' --reporter expanded
      - name: Prepare the Linux gallery with the face and hand tasks
        run: |
          python3 -B gallery/tool/prepare.py --target linux/x64 --tasks face_landmarker,hand_landmarker
          cd gallery && flutter pub get
      # The gallery runs under Xvfb with EGL's default platform, as on a
      # desktop: Flutter renders with OpenGL while MediaPipe's GPU task runs
      # in the same process.
      - name: Gallery GPU inside the running Flutter app (renamed renderer)
        working-directory: gallery
        env:
          force_gl_renderer: Mesa software rasterizer, renamed for a MediaPipe CI test
        run: |
          for task in face hand; do
            xvfb-run -a -s "-screen 0 1600x1000x24" flutter test -d linux \
              integration_test/desktop_gpu_camera_test.dart \
              --dart-define=GALLERY_LIVE_TASK=$task \
              --dart-define=GALLERY_GPU_EXPECT=works --reporter expanded
          done
      - name: Gallery falls back to CPU visibly when the GPU is refused
        working-directory: gallery
        run: |
          for task in face hand; do
            xvfb-run -a -s "-screen 0 1600x1000x24" flutter test -d linux \
              integration_test/desktop_gpu_camera_test.dart \
              --dart-define=GALLERY_LIVE_TASK=$task \
              --dart-define=GALLERY_GPU_EXPECT=refused --reporter expanded
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-gpu-reference
          path: |
            build/gpu-reference/**/*.json
            build/gpu-reference/*.log
          if-no-files-found: error
