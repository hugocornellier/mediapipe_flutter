name: Desktop tasks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push on the same branch supersedes the queued matrix; the hosted
# macOS pool is small enough that stale runs otherwise starve the latest one.
concurrency:
  group: desktop-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  face-tasks:
    name: Vision tasks / ${{ matrix.os }} x64 CPU
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Flutter host dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good libegl1 libgles2
      - name: Validate Linux CPU references and debug/release consumers
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 -B packages/mediapipe-task-vision/tool/test_desktop.py --object-detector --image-tasks --landmark-tasks --segmenter-tasks --interactive-segmenter
      - name: Validate Windows CPU references and debug/release consumers
        if: runner.os == 'Windows'
        run: python -B packages/mediapipe-task-vision/tool/test_desktop.py --object-detector --image-tasks --landmark-tasks --segmenter-tasks
      - name: Build and exercise the Linux CPU gallery
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 -B gallery/tool/test_desktop.py
      - name: Build and exercise the Windows CPU gallery
        if: runner.os == 'Windows'
        run: python -B gallery/tool/test_desktop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-cpu-${{ matrix.os }}
          path: |
            build/codex-tmp/desktop-*/*.log
            build/codex-tmp/desktop-*/report.json
            build/codex-tmp/desktop-*/reference/**/*.json
            build/codex-tmp/gallery-desktop-*/*.log
            build/codex-tmp/gallery-desktop-*/report.json
          if-no-files-found: error

  linux-gpu:
    name: Vision face and hand tasks / ubuntu-24.04 x64 GPU (Mesa, renamed renderer)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MEDIAPIPE_GPU_REFERENCE_DIR: ${{ github.workspace }}/build/gpu-reference
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mesa's EGL and OpenGL ES, and the Flutter Linux host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri \
            clang cmake ninja-build pkg-config libgtk-3-dev xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good
      - name: Download the face and hand models
        working-directory: packages/mediapipe-task-vision
        run: |
          dart pub get
          dart tool/download_model.dart
          dart tool/download_face_landmarker.dart
          dart tool/download_landmark_tasks.dart
      - name: Official 1.0.1 GPU references and Dart GPU suites on llvmpipe
        env:
          # Google's runtime refuses renderers named llvmpipe or softpipe.
          # Mesa's force_gl_renderer renames the same software renderer, so
          # the unmodified GPU path runs. This checks results against Google's
          # own GPU output on this runner, not support for software GPUs.
          force_gl_renderer: Mesa software rasterizer, renamed for a MediaPipe CI test
          # Without a display the default EGL platform fails.
          EGL_PLATFORM: surfaceless
        run: python3 -B packages/mediapipe-task-vision/tool/prepare_gpu_reference.py --test
      - name: Without the rename, the refused GPU is reported and not replaced
        working-directory: build/gpu-face-tests
        env:
          MEDIAPIPE_EXPECT_GPU_REFUSAL: '1'
          EGL_PLATFORM: surfaceless
        run: dart test test/face_landmarker_test.dart --name 'a refused GPU is reported' --reporter expanded
      - name: Prepare the Linux gallery with the face and hand tasks
        run: |
          python3 -B gallery/tool/prepare.py --target linux/x64 --tasks face_landmarker,hand_landmarker
          cd gallery && flutter pub get
      # The gallery runs under Xvfb with EGL's default platform, as on a
      # desktop: Flutter renders with OpenGL while MediaPipe's GPU task runs
      # in the same process.
      - name: Gallery GPU inside the running Flutter app (renamed renderer)
        working-directory: gallery
        env:
          force_gl_renderer: Mesa software rasterizer, renamed for a MediaPipe CI test
        run: |
          for task in face hand; do
            xvfb-run -a -s "-screen 0 1600x1000x24" flutter test -d linux \
              integration_test/desktop_gpu_camera_test.dart \
              --dart-define=GALLERY_LIVE_TASK=$task \
              --dart-define=GALLERY_GPU_EXPECT=works --reporter expanded
          done
      - name: Gallery falls back to CPU visibly when the GPU is refused
        working-directory: gallery
        run: |
          for task in face hand; do
            xvfb-run -a -s "-screen 0 1600x1000x24" flutter test -d linux \
              integration_test/desktop_gpu_camera_test.dart \
              --dart-define=GALLERY_LIVE_TASK=$task \
              --dart-define=GALLERY_GPU_EXPECT=refused --reporter expanded
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-gpu-reference
          path: |
            build/gpu-reference/**/*.json
            build/gpu-reference/*.log
          if-no-files-found: error
