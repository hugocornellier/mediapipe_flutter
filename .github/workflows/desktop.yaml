name: Desktop CPU tasks

permissions:
  contents: read

on:
  push:
    branches: [main, runtime-table-and-vision-runtime]
  pull_request:
  workflow_dispatch:

jobs:
  face-tasks:
    name: Vision tasks / ${{ matrix.os }} x64 CPU
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Flutter host dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - name: Validate Linux CPU references and debug/release consumers
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 -B packages/mediapipe-task-vision/tool/test_desktop.py --object-detector --image-tasks --landmark-tasks
      - name: Validate Windows CPU references and debug/release consumers
        if: runner.os == 'Windows'
        run: python -B packages/mediapipe-task-vision/tool/test_desktop.py --object-detector --image-tasks --landmark-tasks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-cpu-${{ matrix.os }}
          path: |
            build/codex-tmp/desktop-*/*.log
            build/codex-tmp/desktop-*/report.json
            build/codex-tmp/desktop-*/reference/**/*.json
          if-no-files-found: error
