name: Decision Maker

permissions:
  contents: read

# The Decision Maker checks: the package against Google's Python answers on
# each desktop, the gallery's Decision test and journey on the desktops, the
# Android emulator and the iOS simulator, and the browser journey, recording
# task coverage rows for the gate. Dispatch by hand to run a subset of the
# jobs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      jobs:
        description: Jobs to run (package, gallery, android, ios, web), comma-separated, or all
        required: false
        default: all

concurrency:
  group: decision-${{ github.ref }}-${{ inputs.jobs || 'all' }}
  cancel-in-progress: true

jobs:
  package:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'package') }}
    name: Decision package / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install Linux graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2
      # Google's Windows runtime uploads usage logs and a task's close waits
      # for the upload (upstream-issues.md UP-025).
      - name: Keep Google's usage logging off the network
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content "$env:SystemRoot\System32\drivers\etc\hosts" "`n0.0.0.0 play.googleapis.com`n:: play.googleapis.com"
          ipconfig /flushdns | Out-Null
      - uses: actions/cache@v6
        with:
          path: packages/mediapipe-task-decision/models/laya_s256.task
          key: decision-laya-s256-${{ hashFiles('packages/mediapipe-task-decision/lib/models.dart') }}
      - name: Resolve packages
        working-directory: packages/mediapipe-task-decision
        run: flutter pub get
      - name: Download Google's Laya model
        working-directory: packages/mediapipe-task-decision
        run: dart run tool/download_model.dart
      - name: Analyze
        working-directory: packages/mediapipe-task-decision
        run: dart analyze --fatal-infos
      - name: Decision Maker against Google's Python answers
        working-directory: packages/mediapipe-task-decision
        run: dart test --reporter expanded

  gallery:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'gallery') }}
    name: Decision gallery / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: macos/arm64, device: macos}
          - {os: ubuntu-24.04, target: linux/x64, device: linux}
          - {os: windows-2025, target: windows/x64, device: windows}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install Linux Flutter host dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-libav libegl1 libgles2
      - name: Keep Google's usage logging off the network
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content "$env:SystemRoot\System32\drivers\etc\hosts" "`n0.0.0.0 play.googleapis.com`n:: play.googleapis.com"
          ipconfig /flushdns | Out-Null
      # Decision Maker, and the one vision task the vision hook needs.
      - name: Prepare the gallery
        run: dart run tool/gallery_builder/bin/prepare_gallery.dart --target ${{ matrix.target }} --tasks decision_maker,image_embedder
      - name: Analyze and unit-test the gallery
        working-directory: gallery
        run: |
          flutter analyze
          flutter test test
      - name: Decision Maker in the app against Google's answers
        id: app
        working-directory: gallery
        shell: bash
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          run flutter test -d ${{ matrix.device }} integration_test/decision_maker_test.dart --reporter expanded
      - name: The journey through the Decision page
        id: journey
        working-directory: gallery
        shell: bash
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          run flutter test -d ${{ matrix.device }} integration_test/gallery_journey_test.dart --reporter expanded
      - name: Record ${{ matrix.device }} CPU Decision Maker coverage
        if: always()
        shell: bash
        run: python3 -B tool/coverage/record.py --suite ${{ matrix.device }}-decision --platform ${{ matrix.device }} --delegate cpu --tasks decision_maker --outcome "${{ steps.app.outcome == 'success' && steps.journey.outcome || steps.app.outcome }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-decision-${{ matrix.device }}
          path: build/coverage/

  android:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'android') }}
    # Google's per-family decision library on the x86_64 emulator, CPU only:
    # the in-app test and the journey through the Decision page and Hungry
    # Fish, which download Laya (678 MB) and the text and vision EmbeddingGemma
    # 2 (388 MB), the one that library runs (UP-053).
    name: Decision gallery / Android x64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      # Decision Maker, and the one vision task the vision hook needs.
      - name: Prepare the gallery
        run: |
          dart run tool/gallery_builder/bin/prepare_gallery.dart --target android/x64 --tasks decision_maker,face_detector
          cd gallery && flutter pub get
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Decision Maker in the app, and the journey through its pages
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: |
            cd gallery
            timeout 1500 flutter test -d emulator-5554 integration_test/decision_maker_test.dart --reporter expanded
            timeout 2400 flutter test -d emulator-5554 --dart-define=SDK_GPU=skip integration_test/gallery_journey_test.dart --reporter expanded
      - name: Record android CPU Decision Maker coverage
        if: always()
        run: python3 -B tool/coverage/record.py --suite android-decision-emulator --platform android --delegate cpu --tasks decision_maker --outcome ${{ steps.emulator.outcome }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-decision-android
          path: build/coverage/

  ios:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'ios') }}
    # Google's per-family decision library on the iOS simulator, CPU only.
    name: Decision gallery / iOS simulator
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Make flutter test wait for the simulator log reader
        run: python3 -B tool/ci/patch_flutter_simulator_launch.py
      - name: Prepare the gallery
        run: |
          dart run tool/gallery_builder/bin/prepare_gallery.dart --target ios-simulator/arm64 --tasks decision_maker,face_detector
          cd gallery && flutter pub get
      - name: Boot an installed iPhone simulator
        id: simulator
        run: |
          device=$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json'], text=True))['devices']
          candidates = [d for runtime, entries in devices.items() if '.iOS-' in runtime
                        for d in entries if d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No installed iPhone simulator runtime')
          print(candidates[0]['udid'])
          PY
          )
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - name: Decision Maker in the app, and the journey through its pages
        id: simulator_tests
        working-directory: gallery
        shell: bash
        run: |
          device=${{ steps.simulator.outputs.device }}
          perl -e 'alarm shift; exec @ARGV' 1500 flutter test -d "$device" integration_test/decision_maker_test.dart --reporter expanded
          perl -e 'alarm shift; exec @ARGV' 2400 flutter test -d "$device" --dart-define=SDK_GPU=skip integration_test/gallery_journey_test.dart --reporter expanded
      - name: Record ios CPU Decision Maker coverage
        if: always()
        run: python3 -B tool/coverage/record.py --suite ios-decision-simulator --platform ios --delegate cpu --tasks decision_maker --outcome ${{ steps.simulator_tests.outcome }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-decision-ios
          path: build/coverage/

  web:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'web') }}
    # Google's browser Decision Maker answers only on a hardware WebGPU adapter
    # (UP-049): the Mac runner's Metal one runs the task, and hosted Linux,
    # with only SwiftShader, checks that the gallery refuses it.
    name: Decision gallery / web Chromium ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gallery/tool/browser/package-lock.json
      # Decision Maker, and the vision task a web build lists for the hook.
      - name: Prepare the web gallery
        run: dart run tool/gallery_builder/bin/prepare_gallery.dart --target web --tasks decision_maker,face_detector
      - name: Prepare the Linux camera fixture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri
          python3 -B gallery/tool/browser/prepare_camera.py
      - name: Install Playwright's Chromium
        working-directory: gallery/tool/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Analyze the Decision package's browser code
        working-directory: packages/mediapipe-task-decision
        run: |
          flutter pub get
          flutter analyze lib
      - name: Build the release gallery
        working-directory: gallery
        run: flutter build web --release --base-href /mediapipe_flutter/ --no-web-resources-cdn
      - name: Start the gallery server
        run: |
          nohup python3 -B gallery/tool/web_server.py > web-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 5 http://127.0.0.1:8866/mediapipe_flutter/ && exit 0
            sleep 2
          done
          cat web-server.log
          exit 1
      # Only the Decision tiles: Face Detector is in the build because the vision
      # hook needs a task, and web.yaml covers it (and its video-file stall on
      # hosted macOS).
      - name: The journey through the Decision pages in Chromium
        id: web_journey
        env:
          LIBGL_ALWAYS_SOFTWARE: ${{ runner.os == 'Linux' && '1' || '' }}
        run: node gallery/tool/browser/test_gallery_journey.mjs --tasks=decision_maker
      # The Mac runner's Metal adapter runs the task and records the web GPU
      # row; hosted Linux checks the refusal (UP-049).
      - name: Record web GPU Decision Maker coverage
        if: always() && runner.os == 'macOS'
        run: python3 -B tool/coverage/record.py --suite web-decision-chromium-${{ matrix.os }} --platform web --delegate gpu --tasks decision_maker --outcome ${{ steps.web_journey.outcome }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-decision-web-${{ matrix.os }}
          path: build/coverage/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-web-journey-${{ matrix.os }}
          path: build/codex-tmp/gallery-journey-chromium/
