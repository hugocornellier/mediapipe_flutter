name: Dart tooling

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Core is a Flutter package (path_provider for the model store), so
      # it needs Flutter's SDK; the Dart tools use the Dart it ships.
      - uses: ./.github/actions/setup
        with:
          python: 'false'
      - name: Test shared types and download integrity
        working-directory: packages/mediapipe-core
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          flutter test --reporter expanded
      # Prepares the gallery for every target with nothing but Dart; its model
      # pins must match the packages', and its task lists come from vision's.
      - name: Check the gallery builder
        working-directory: tool/gallery_builder
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          dart test --reporter expanded
      # The family lists that stay hand-written and the pins that must move
      # together across the packages (tool/check_repository.py).
      - name: Check family lists and shared pins
        run: python3 -B tool/check_repository.py
      # Every public library must match its reviewed snapshot, and each
      # family's API must be identical on native and web and follow the shared
      # conventions (tool/api_parity/README.md).
      - name: Check API parity, conventions and snapshots
        run: |
          for package in packages/mediapipe-task-*/; do
            (cd "$package" && flutter pub get)
          done
          cd tool/api_parity
          dart pub get
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          dart run bin/api_parity.dart
