name: Dart tooling

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Core is a Flutter package (path_provider for the model store), so
      # it needs Flutter's SDK; the Dart tools use the Dart it ships.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Test shared types and download integrity
        working-directory: packages/mediapipe-core
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          flutter test --reporter expanded
      # Prepares the Android and macOS galleries with nothing but Dart; its
      # model pins and macOS task list must match the packages'.
      - name: Check the gallery builder
        working-directory: tool/gallery_builder
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          dart test --reporter expanded
      # The public API must be identical on native and web, follow the shared
      # conventions and match its reviewed snapshot (tool/api_parity/README.md).
      - name: Check API parity, conventions and snapshots
        run: |
          for family in task-vision task-text task-audio; do
            (cd packages/mediapipe-$family && flutter pub get)
          done
          cd tool/api_parity
          dart pub get
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          dart run bin/api_parity.dart
