name: iOS simulator CPU tasks

permissions:
  contents: read

on:
  push:
    branches: [main, ios-combined-runtime]
  pull_request:
  workflow_dispatch:

jobs:
  simulator-consumer:
    name: Face tasks / fresh arm64 iOS simulator consumer
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build tools
        run: brew install bazelisk cmake ninja
      - name: Identify the Xcode toolchain
        id: xcode
        run: |
          python3 - <<'PY'
          import hashlib, os, subprocess
          version = subprocess.check_output(['xcodebuild', '-version'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + hashlib.sha256(version).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache@v4
        with:
          path: |
            build/codex-tmp/bazel
            build/codex-tmp/opencv-ios-simulator-build
            build/codex-tmp/opencv-ios-simulator-install
          key: ios-source-${{ runner.arch }}-${{ steps.xcode.outputs.digest }}-${{ hashFiles('packages/mediapipe-task-vision/tool/build_native.py', 'packages/mediapipe-task-vision/tool/build_ios_simulator.py') }}
      - name: Build the pinned simulator runtime
        run: python3 -B packages/mediapipe-task-vision/tool/build_ios_simulator.py --jobs 3
      - name: Download the pinned face models
        working-directory: packages/mediapipe-task-vision
        run: |
          dart pub get
          dart tool/download_model.dart
          dart tool/download_face_landmarker.dart
      - name: Select an installed iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json'], text=True))['devices']
          candidates = [d for runtime, entries in devices.items() if '.iOS-' in runtime
                        for d in entries if d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No installed iPhone simulator runtime')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('device=' + candidates[0]['udid'] + '\n')
          PY
      - name: Validate CPU references, framework payloads and standalone app inference
        run: python3 -B packages/mediapipe-task-vision/tool/test_ios_consumer.py --device ${{ steps.simulator.outputs.device }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-cpu-validation
          path: |
            build/codex-tmp/ios-consumer-*/*.log
            build/codex-tmp/ios-consumer-*/report.json
          if-no-files-found: error
