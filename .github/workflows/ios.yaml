name: iOS simulator CPU tasks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push on the same branch supersedes the queued matrix; the hosted
# macOS pool is small enough that stale runs otherwise starve the latest one.
concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-consumer:
    name: Face tasks / fresh arm64 iOS simulator consumer
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Make flutter test wait for the simulator log reader
        run: python3 -B tool/ci/patch_flutter_simulator_launch.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build tools
        run: brew install bazelisk cmake ninja
      - name: Identify the Xcode toolchain
        id: xcode
        run: |
          python3 - <<'PY'
          import hashlib, os, subprocess
          version = subprocess.check_output(['xcodebuild', '-version'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + hashlib.sha256(version).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache@v4
        with:
          path: |
            build/codex-tmp/bazel
            build/codex-tmp/opencv-ios-simulator-build
            build/codex-tmp/opencv-ios-simulator-install
          key: ios-source-${{ runner.arch }}-${{ steps.xcode.outputs.digest }}-${{ hashFiles('packages/mediapipe-task-vision/tool/build_native.py', 'packages/mediapipe-task-vision/tool/build_ios_simulator.py') }}
      - name: Build the pinned simulator runtime
        run: python3 -B packages/mediapipe-task-vision/tool/build_ios_simulator.py --jobs 3
      - name: Download the pinned face models
        working-directory: packages/mediapipe-task-vision
        run: |
          dart pub get
          dart tool/download_model.dart
          dart tool/download_face_landmarker.dart
      - name: Select an installed iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json'], text=True))['devices']
          candidates = [d for runtime, entries in devices.items() if '.iOS-' in runtime
                        for d in entries if d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No installed iPhone simulator runtime')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('device=' + candidates[0]['udid'] + '\n')
          PY
      - name: Validate CPU references, framework payloads and standalone app inference
        run: python3 -B packages/mediapipe-task-vision/tool/test_ios_consumer.py --device ${{ steps.simulator.outputs.device }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-cpu-validation
          path: |
            build/codex-tmp/ios-consumer-*/*.log
            build/codex-tmp/ios-consumer-*/report.json
          if-no-files-found: warn

  # Hand, Pose, Gesture, Holistic, Face and Object Detector, Image Classifier
  # and Image Embedder run through Google's prebuilt 1.0.1 iOS SDK, so this job needs
  # no source build. The simulator runs them on the CPU
  # only: Google's SDK aborts in its Metal preprocessing there. Metal is a
  # phone check.
  sdk-tasks:
    name: Landmark, detection and classification tasks / official iOS SDK on an arm64 simulator
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Make flutter test wait for the simulator log reader
        run: python3 -B tool/ci/patch_flutter_simulator_launch.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the official SDK task models
        working-directory: packages/mediapipe-task-vision
        run: |
          dart pub get
          dart tool/download_face_landmarker.dart
          dart tool/download_landmark_tasks.dart
          dart tool/download_model.dart
          dart tool/download_image_tasks.dart
          dart tool/download_object_detector.dart
          dart tool/download_segmenter_tasks.dart
          dart tool/download_interactive_segmenter.dart
      - uses: actions/cache@v4
        with:
          path: gallery/.dart_tool/hooks_runner/shared/mediapipe_flutter_vision/build/official-ios-sdk/*/sdk.zip
          key: official-ios-sdk-${{ hashFiles('packages/mediapipe-task-vision/sdk_downloads.dart', 'packages/mediapipe-task-vision/lib/src/native_assets/ios_sdk.dart') }}
      - name: Prepare the gallery with the official SDK tasks
        run: |
          python3 -B gallery/tool/prepare.py --target ios-simulator/arm64 \
            --tasks face_landmarker,hand_landmarker,pose_landmarker,gesture_recognizer,holistic_landmarker,face_detector,object_detector,image_classifier,image_embedder,image_segmenter,interactive_segmenter,interactive_segmenter_legacy,audio_classifier,language_detector,text_classifier,text_embedder
          cd gallery && flutter pub get
      - name: Boot an installed iPhone simulator
        id: simulator
        run: |
          device=$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json'], text=True))['devices']
          candidates = [d for runtime, entries in devices.items() if '.iOS-' in runtime
                        for d in entries if d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No installed iPhone simulator runtime')
          print(candidates[0]['udid'])
          PY
          )
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - name: Official references, pixel formats, rotation, VIDEO and every live tile
        id: sdk
        working-directory: gallery
        # bash runs with pipefail, so `| tee` keeps flutter test's exit status.
        shell: bash
        run: |
          device=${{ steps.simulator.outputs.device }}
          for test in sdk_face_landmarker_test sdk_hand_landmarker_test sdk_landmark_tasks_test sdk_detection_tasks_test sdk_embedder_test sdk_segmenter_test sdk_interactive_segmenter_test runtime_test; do
            for attempt in 1 2; do
              status=0
              # A hosted simulator sometimes stalls while loading the app and
              # never starts the tests. Each file finishes in minutes, so a
              # file that takes 15 runs once more on a rebooted simulator.
              perl -e 'alarm shift; exec @ARGV' 900 flutter test -d "$device" \
                integration_test/$test.dart \
                --dart-define=SDK_GPU=skip --reporter expanded 2>&1 | tee -a sdk-ios-simulator.log || status=$?
              [ "$status" = 0 ] && break
              if [ "$status" = 142 ] && [ "$attempt" = 1 ]; then
                echo "$test stalled; rebooting the simulator and retrying"
                xcrun simctl shutdown "$device" || true
                xcrun simctl boot "$device"
                xcrun simctl bootstatus "$device" -b
                continue
              fi
              exit "$status"
            done
          done
      - name: Record ios CPU task coverage (ios-sdk-simulator)
        if: always()
        run: python3 -B tool/coverage/record.py --suite ios-sdk-simulator --platform ios --delegate cpu --tasks face_detector,face_landmarker,gesture_recognizer,hand_landmarker,holistic_landmarker,image_classifier,image_embedder,image_segmenter,interactive_segmenter,object_detector,pose_landmarker --outcome ${{ steps.sdk.outcome }}
      # Text and audio run in the same SDK adapter, which core's runtime
      # resolves to on iOS.
      - name: Text and audio through Google's iOS SDK
        id: text_audio
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        working-directory: gallery
        # bash runs with pipefail, so `| tee` keeps flutter test's exit status.
        shell: bash
        run: |
          device=${{ steps.simulator.outputs.device }}
          for attempt in 1 2; do
            status=0
            perl -e 'alarm shift; exec @ARGV' 900 flutter test -d "$device" \
              integration_test/sdk_text_audio_test.dart \
              --dart-define=SDK_GPU=skip --reporter expanded 2>&1 | tee -a sdk-ios-simulator.log || status=$?
            [ "$status" = 0 ] && exit 0
            if [ "$status" = 142 ] && [ "$attempt" = 1 ]; then
              echo "sdk_text_audio_test stalled; rebooting the simulator and retrying"
              xcrun simctl shutdown "$device" || true
              xcrun simctl boot "$device"
              xcrun simctl bootstatus "$device" -b
              continue
            fi
            exit "$status"
          done
      - name: Record ios CPU text and audio coverage (ios-sdk-simulator-text-audio)
        if: always()
        run: python3 -B tool/coverage/record.py --suite ios-sdk-simulator-text-audio --platform ios --delegate cpu --tasks audio_classifier,language_detector,text_classifier,text_embedder --outcome ${{ steps.text_audio.outcome }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ios-sdk-simulator
          path: build/coverage/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-sdk-tasks
          path: gallery/sdk-ios-simulator.log
          if-no-files-found: warn
