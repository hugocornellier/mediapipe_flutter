name: Bundled models

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: bundled-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A fresh app lists one model per family in its pubspec, bundles them with
  # `dart run mediapipe_core:bundle_models`, which downloads them from Google
  # on this host, and runs them with networking blocked, in debug and release
  # (packages/mediapipe-core/tool/test_bundled_models.py).
  desktop:
    name: Bundled models / ${{ matrix.os }} x64
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux Flutter host dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb libegl1 libgles2
      # The store's lock, downloads and file replacement on this host's file
      # system. The rest of core's suite runs on macOS in main.yaml.
      - name: Model store and bundling unit tests
        working-directory: packages/mediapipe-core
        run: flutter pub get && dart test test/model_store_test.dart test/model_bundling_test.dart --reporter expanded
      # As in desktop.yaml: Google's Windows runtime can hold a task's close
      # for its usage-log upload (upstream-issues.md UP-025).
      - name: Keep Google's usage logging off the network
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content "$env:SystemRoot\System32\drivers\etc\hosts" "`n0.0.0.0 play.googleapis.com`n:: play.googleapis.com"
          ipconfig /flushdns | Out-Null
      - name: Bundle a fresh app's models and run them offline (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 -B packages/mediapipe-core/tool/test_bundled_models.py
      - name: Bundle a fresh app's models and run them offline (Windows)
        if: runner.os == 'Windows'
        run: python -B packages/mediapipe-core/tool/test_bundled_models.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundled-models-${{ matrix.os }}
          path: |
            build/codex-tmp/bundled-*/*.log
            build/codex-tmp/bundled-*/report.json
          if-no-files-found: error
