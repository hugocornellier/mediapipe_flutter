name: Android emulator CPU tasks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push on the same branch supersedes the queued matrix; the hosted
# macOS pool is small enough that stale runs otherwise starve the latest one.
concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-consumer:
    name: Face tasks / fresh x64 Android emulator consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false
      - name: Install the pinned Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      # The source build is pinned: the same scripts, notices and NDK build the
      # same runtime, so it is rebuilt only when one of them changes. The
      # validation below tests the runtime exactly as after a fresh build.
      - uses: actions/cache/restore@v6
        id: x64-runtime
        with:
          path: packages/mediapipe-task-vision/build/native/android/x86_64
          key: android-x86_64-face-runtime-${{ runner.os }}-ndk28.2.13676358-${{ hashFiles('packages/mediapipe-task-vision/tool/build_native.py', 'packages/mediapipe-task-vision/tool/build_android.py', 'packages/mediapipe-task-vision/third_party/LICENSE', 'packages/mediapipe-task-vision/third_party/NOTICE', 'packages/mediapipe-task-vision/third_party/OPENCV_CAROTENE_NOTICES') }}
      - name: Build the pinned x64 runtime
        if: steps.x64-runtime.outputs.cache-hit != 'true'
        run: python3 -B packages/mediapipe-task-vision/tool/build_android.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --abi x86_64 --jobs 4
      - uses: actions/cache/save@v6
        if: steps.x64-runtime.outputs.cache-hit != 'true'
        with:
          path: packages/mediapipe-task-vision/build/native/android/x86_64
          key: ${{ steps.x64-runtime.outputs.cache-primary-key }}
      - name: Download the pinned face models
        working-directory: packages/mediapipe-task-vision
        run: |
          dart pub get
          dart tool/download_model.dart
          dart tool/download_face_landmarker.dart
      - name: Generate this host's official CPU reference
        # The official Linux 1.0.1 library links EGL and OpenGL ES, CPU included.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgles2
          python3 -B packages/mediapipe-task-vision/tool/cpu_reference.py --output-dir build/codex-tmp/android-reference
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate CPU references, APK payloads and debug/release app inference
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 -B packages/mediapipe-task-vision/tool/test_android_consumer.py --device emulator-5554 --reference-dir build/codex-tmp/android-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-cpu-validation
          path: |
            build/codex-tmp/android-consumer-*/*.log
            build/codex-tmp/android-consumer-*/report.json
            build/codex-tmp/android-reference/*.log
            build/codex-tmp/android-reference/provenance.json
          if-no-files-found: warn

  # Text Classifier, Text Embedder, Language Detector and Audio Classifier run
  # through the text and audio packages' Android SDK plugins in the same app.
  # Face and Hand Landmarker, Pose, Gesture, Holistic, Face and Object Detector, Image Classifier
  # and Image Embedder run through Google's Android SDK (tasks-vision 1.0.0) and
  # mediapipe_vision, so this job needs no source build. The emulator runs them on the CPU only; see
  # gallery/tool/test_android_sdk_tasks.sh.
  sdk-tasks:
    name: Landmark, detection and classification tasks / official Android SDK on an x64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      # The generative text models, 419 MB in all, by their pinned SHA-256.
      - uses: actions/cache@v6
        with:
          path: |
            packages/mediapipe-task-text/models/embedding_gemma.task
            packages/mediapipe-task-text/models/proofread_quant_200m.litertlm
            packages/mediapipe-task-text/models/summarization_quant_200m_2modes.litertlm
          key: modern-text-models-${{ hashFiles('packages/mediapipe-task-text/lib/models.dart') }}
      # Google's answers for the 1.0.0 Android SDK on the x86_64 emulator: its
      # Linux x86_64 1.0.0 wheel on this runner.
      - name: Google's 1.0.0 references for EmbeddingGemma, Proofreader and Summarizer
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgles2
          cd packages/mediapipe-task-text
          dart pub get
          dart tool/download_embedding_gemma.dart
          dart tool/download_proofreader.dart
          dart tool/download_summarizer.dart
          cd ../..
          python3 -B packages/mediapipe-task-text/tool/prepare_modern_text_reference.py \
            --venv build/codex-tmp/official-python-1.0.0 --runtime-version 1.0.0 \
            --output-dir build/modern-text-reference
      # The same two commands a clean checkout runs, so CI builds what a
      # contributor with only Dart, Flutter and the Android SDK builds; the
      # generative text tasks are opt-in, bundled here for their suite.
      - name: Prepare the gallery with the official SDK tasks
        run: |
          dart run tool/gallery_builder/bin/prepare_gallery.dart --target android/x64 \
            --tasks audio_classifier,face_detector,face_landmarker,gesture_recognizer,hand_landmarker,holistic_landmarker,image_classifier,image_embedder,image_segmenter,interactive_segmenter,language_detector,object_detector,pose_landmarker,text_classifier,text_embedder,embedding_gemma,text_proofreader,text_summarizer \
            --modern-text-reference build/modern-text-reference
          cd gallery && flutter pub get
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Official references, pixel formats, rotation, VIDEO, camera and every live tile
        id: sdk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # A phone profile, as flutter_litert's emulator job uses, with 4 GB:
          # every task's models load into one app.
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: bash gallery/tool/test_android_sdk_tasks.sh emulator-5554
      - name: Record android CPU task coverage (android-sdk-emulator-text-audio)
        if: always()
        run: python3 -B tool/coverage/record.py --suite android-sdk-emulator-text-audio --platform android --delegate cpu --tasks audio_classifier,language_detector,text_classifier,text_embedder --outcome ${{ steps.sdk.outcome }}
      - name: Record android CPU modern text coverage (android-sdk-emulator-modern-text)
        if: always()
        run: python3 -B tool/coverage/record.py --suite android-sdk-emulator-modern-text --platform android --delegate cpu --tasks embedding_gemma,text_proofreader,text_summarizer --outcome "$(cat build/coverage-outcomes/android-modern-text 2>/dev/null || echo failure)"
      - name: Record android CPU task coverage (android-sdk-emulator)
        if: always()
        run: python3 -B tool/coverage/record.py --suite android-sdk-emulator --platform android --delegate cpu --tasks face_detector,face_landmarker,gesture_recognizer,hand_landmarker,holistic_landmarker,image_classifier,image_embedder,image_segmenter,interactive_segmenter,object_detector,pose_landmarker --outcome ${{ steps.sdk.outcome }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-android-sdk-emulator
          path: build/coverage/
          if-no-files-found: error
      # Only release builds run R8, and every test above is a debug build. R8
      # removes a field that is written but never read, so a plugin that keeps
      # memory alive for native code that way loses it in release builds only
      # (UP-033 in upstream-issues.md). This fails on any instance field R8
      # removed from the plugins. The APK is the release gallery, for phones.
      - name: Release gallery keeps every plugin field through R8
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m unittest tool/ci/test_check_r8_usage.py
          dart run tool/gallery_builder/bin/prepare_gallery.dart --target android/arm64
          cd gallery
          flutter build apk --release --target-platform android-arm64
          python3 -B ../tool/ci/check_r8_usage.py build/app/outputs/mapping/release/usage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-release-android-arm64
          path: gallery/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
