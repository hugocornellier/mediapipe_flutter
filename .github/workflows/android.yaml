name: Android emulator CPU tasks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  emulator-consumer:
    name: Face tasks / fresh x64 Android emulator consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false
      - name: Install the pinned Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - uses: actions/cache@v4
        with:
          path: build/codex-tmp/bazel
          key: android-x64-ndk28-source-${{ hashFiles('packages/mediapipe-task-vision/tool/build_native.py', 'packages/mediapipe-task-vision/tool/build_android.py') }}
      - name: Build the pinned x64 runtime
        run: python3 -B packages/mediapipe-task-vision/tool/build_android.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --abi x86_64 --jobs 4
      - name: Download the pinned face models
        working-directory: packages/mediapipe-task-vision
        run: |
          dart pub get
          dart tool/download_model.dart
          dart tool/download_face_landmarker.dart
      - name: Generate this host's official CPU reference
        run: python3 -B packages/mediapipe-task-vision/tool/cpu_reference.py --output-dir build/codex-tmp/android-reference
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate CPU references, APK payloads and debug/release app inference
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 -B packages/mediapipe-task-vision/tool/test_android_consumer.py --device emulator-5554 --reference-dir build/codex-tmp/android-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-cpu-validation
          path: |
            build/codex-tmp/android-consumer-*/*.log
            build/codex-tmp/android-consumer-*/report.json
            build/codex-tmp/android-reference/*.log
            build/codex-tmp/android-reference/provenance.json
          if-no-files-found: warn
